name: Build and Deploy Docs

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  # Rebuilds and republishes main on demand.
  workflow_dispatch:

# All build/deploy/preview machinery lives in the shared reusable workflow
# maintained alongside the workspace skill that scaffolded this repo — this
# stub only decides when it runs. Repo-specific quality gates belong in this
# repo's `make check` target (which the shared workflow calls), never here.
#
# The token needs write access for gh-pages pushes and PR preview comments;
# the called workflow's jobs individually downscope to least privilege.
# `pages: read` lets the deploy job resolve the real served URL for the preview
# link (private/internal repos use an obfuscated *.pages.github.io domain).
# Keep these grants when upgrading an existing caller: scope reads PR files,
# publication writes gh-pages, and cleanup retires obsolete preview comments.
# GitHub rejects a called workflow that asks for a grant its caller omits.
permissions:
  contents: write
  pull-requests: write
  pages: read

jobs:
  docs:
    # Upgrade policy — the same one the render-time assets use (see the Makefile
    # `workspace-assets` target and DEVELOPER.md): track the latest published
    # asta-plugins version tag, so all workspace assets move together. The
    # co-located deploy assets (what-changed.py and the vendored-script drift
    # baselines) are fetched at this workflow's own commit, so pinning the ref
    # here pins them too. GitHub Actions `uses:` takes a literal ref and can't
    # resolve "latest" itself. `make set-version` keeps this ref aligned with
    # each release tag; existing projects receive the one-line bump when their
    # workspace assets are upgraded.
    uses: allenai/asta-plugins/.github/workflows/workspace-quarto-site.yml@v0.124.0
    # For a site below the repository root, set site-dir. By default only
    # changes under that directory render; list additional repository-relative
    # globs in render-paths when shared assets outside it affect the site.
    # These are Python fnmatch patterns: both * and ** match across /.
    # Only one site per repository may publish to the gh-pages root.
    # Do not add pull_request.paths: closing any PR must clean up its preview,
    # including after matching changes were reverted or renamed away.
    # with:
    #   site-dir: research/site
    #   render-paths: |
    #     research/site/**
    #     shared-theme/**
