# Weekly PRs that move the workflows' pinned asta-plugins ref to its newest
# release; `asta-plugins-upgrade.yml` merges a passing non-major one. The group
# keeps the docs.yml and upgrade-stub pins in one PR so they move together.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      asta-plugins:
        patterns:
          - "allenai/asta-plugins*"
