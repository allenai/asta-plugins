name: asta-plugins upgrade

# Merges a Dependabot PR that moves asta-plugins to a newer non-major release
# once the required checks pass, then redeploys the site from the default
# branch. Anything else Dependabot proposes waits for review. The logic lives
# in asta-plugins' shared workflow; this stub only decides when it runs.
# Run the default branch's stub and its already-trusted release pin. The new
# pin in a Dependabot PR must not control its own privileged merge gate.
# Never check out or execute PR code here; docs.yml builds it separately.
on: pull_request_target

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  statuses: read

jobs:
  upgrade:
    # Keep this ref equal to the one in docs.yml; Dependabot moves both.
    uses: allenai/asta-plugins/.github/workflows/workspace-dependabot-upgrade.yml@v0.113.0
