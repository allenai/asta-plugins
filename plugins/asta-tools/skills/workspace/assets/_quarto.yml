project:
  type: website
  output-dir: _site
  preview:
    port: 4848

bibliography: references.bib

# Supporting-evidence store for the `.ev` hover snippets (see
# _extensions/evidence/README.md). Merged into document metadata so a claim can
# back itself with a verbatim quote by key: `[90 tasks]{.ev key="…"}`.
metadata-files:
  - evidence.yml

# Hover-viewable supporting quotes for claims. `make workspace-assets` fetches
# this extension from asta-plugins before rendering; it is not vendored here.
# The filter is a no-op when a document has no `.ev` spans.
filters:
  - _extensions/evidence/snippet.lua

website:
  title: "{{TITLE}}"
  sidebar:
    tools:
      - icon: github
        href: "{{REPO_URL}}"
        text: "GitHub repo"
        target: _blank
    contents: auto

format:
  html:
    theme:
      light: [cosmo, _extensions/asta-theme/light.scss]
      dark: [cosmo, _extensions/asta-theme/dark.scss]
    # Asta's look (_extensions/asta-theme/README.md): follow the reader's
    # system setting, with a toggle. Set your own theme here to replace it.
    respect-user-color-scheme: true
    css: _extensions/asta-theme/asta.css
    toc: true
    toc-location: left
    include-in-header:
      - _extensions/asta-theme/asta-head.html
      - _extensions/evidence/evidence.head.html
    include-after-body:
      - _extensions/evidence/evidence.body.html
