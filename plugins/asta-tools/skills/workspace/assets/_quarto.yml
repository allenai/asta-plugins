project:
  type: website
  output-dir: _site
  # The pages to render: the front page and any other page beside it, and the workflow
  # pages, pages/<NNNN>-<workflow>.qmd, one per run. List any page elsewhere here too.
  render:
    - "*.qmd"
    - "pages/*.qmd"
  # Quarto's sidebar fails with a TypeError on an empty pages/ folder, so an empty one is
  # removed before each render. It comes back with the first page.
  pre-render: "find . -maxdepth 1 -type d -name pages -empty -delete"
  preview:
    port: 4848

bibliography: references.bib

# Supporting-evidence store for the `.ev` hover snippets (see
# _extensions/evidence/README.md). Merged into document metadata so a claim can
# back itself with a verbatim quote by key: `[90 tasks]{.ev key="…"}`.
metadata-files:
  - evidence.yml

# Hover-viewable supporting quotes for claims. `make workspace-assets` fetches
# this extension from asta-plugins before rendering; it is not vendored here.
# The filter is a no-op when a document has no `.ev` spans.
filters:
  - _extensions/evidence/snippet.lua
  # Links mentions of theories, tests, gaps, experiments and figures, with a card for each.
  - asta-templates

website:
  title: "{{TITLE}}"
  sidebar:
    tools:
      - icon: github
        href: "{{REPO_URL}}"
        text: "GitHub repo"
        target: _blank
    # The front page, then the workflow pages, flat, by file name: run order.
    contents:
      - text: "Home"
        href: index.qmd
      - auto: "pages/*.qmd"

format:
  html:
    theme:
      dark: [cosmo, _extensions/asta-theme/dark.scss]
      light: [cosmo, _extensions/asta-theme/light.scss]
    # Asta's look: dark by default, with a switch to light that the reader's
    # browser remembers.
    # Set your own theme here to replace it.
    respect-user-color-scheme: false
    css: _extensions/asta-theme/asta.css
    toc: true
    toc-location: left
    # Wider reading column than Quarto's 800px default.
    grid:
      body-width: 1000px
    include-in-header:
      - _extensions/asta-theme/asta-head.html
      - _extensions/evidence/evidence.head.html
    include-after-body:
      - _extensions/evidence/evidence.body.html
