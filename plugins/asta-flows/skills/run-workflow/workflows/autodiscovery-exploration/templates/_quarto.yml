project:
  type: website
  output-dir: _site
  render:
    - index.qmd
  resources:
    - robots.txt
    - figures/*.jpg
    # The runs table links each run's experiments.
    - runs/*/experiments.csv
  preview:
    port: 4848

# The evidence store behind the markers.
metadata-files:
  - evidence.yml

filters:
  - _extensions/evidence/snippet.lua
  # Every run and its experiments, drawn from runs/ into the write-up's ::: {.runs} block.
  - _extensions/runs/runs.lua
evidence-provenance: false

website:
  title: "<Title, the same as the write-up's>"

format:
  html:
    theme:
      dark: [cosmo, _extensions/asta-theme/dark.scss]
      light: [cosmo, _extensions/asta-theme/light.scss]
    respect-user-color-scheme: false
    lightbox: false
    css:
      - _extensions/asta-theme/asta.css
    toc: true
    toc-location: left
    include-in-header:
      - robots-noindex.html
      - _extensions/asta-theme/asta-head.html
      - _extensions/evidence/evidence.head.html
    include-after-body:
      - _extensions/evidence/evidence.body.html
