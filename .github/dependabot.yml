version: 2
updates:
  - package-ecosystem: npm
    directory: /image/skills-cli
    schedule:
      interval: weekly
  # Use cron for weekend coverage and skip the release-age delay for CI tools.
  - package-ecosystem: npm
    directory: /.github/ci-tools
    schedule:
      interval: cron
      cronjob: "17 8 * * *"
    cooldown:
      default-days: 0
