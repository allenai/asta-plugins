version: 2
updates:
  - package-ecosystem: npm
    directory: /image/skills-cli
    schedule:
      interval: weekly
  # Agent CLIs CI runs. Daily, one PR per CLI so a broken release doesn't hold
  # the other back; ci-tools-auto-merge.yml merges them once required checks pass.
  - package-ecosystem: npm
    directory: /.github/ci-tools
    schedule:
      interval: daily
