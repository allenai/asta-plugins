name: Codex plugin compatibility

# Weekly check against the latest Codex CLI. A pass on a newer release
# refreshes one pin-bump PR for .github/codex-version; a failure keeps the pin
# and opens one issue per failing version and check set.
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  canary:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.cli.outputs.version }}
      setup-failure: >-
        ${{ steps.checkout.outcome == 'failure' && 'checkout'
            || steps.node.outcome == 'failure' && 'Node.js setup'
            || steps.cli.outcome == 'failure' && 'Codex install'
            || steps.uv.outcome == 'failure' && 'uv setup' || '' }}
      failed-checks: ${{ steps.install.outcome == 'failure' && 'plugin install and skill descriptions' || '' }}
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: "20"

      - name: Install latest Codex CLI
        id: cli
        run: |
          npm install -g @openai/codex@latest
          codex_bin="$(npm prefix -g)/bin"
          reported="$("$codex_bin/codex" --version)"
          version="$(bash scripts/parse-cli-version.sh codex "$reported")"
          printf '%s\n' "$codex_bin" >> "$GITHUB_PATH"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Tested Codex $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        id: uv

      - name: Verify plugin install and model-visible skill descriptions
        id: install
        run: bash scripts/verify-plugin-install.sh codex

  maintain-pin:
    needs: canary
    if: always()
    uses: ./.github/workflows/cli-pin-maintenance.yml
    permissions:
      contents: read
      pull-requests: read
      issues: write
    with:
      cli: codex
      cli-name: Codex
      checks: plugin installation and model-visible skill descriptions
      canary-result: ${{ needs.canary.result }}
      version: ${{ needs.canary.outputs.version }}
      setup-failure: ${{ needs.canary.outputs.setup-failure }}
      failed-checks: ${{ needs.canary.outputs.failed-checks }}
    secrets:
      PIN_BUMP_APP_PRIVATE_KEY: ${{ secrets.PIN_BUMP_APP_PRIVATE_KEY }}
