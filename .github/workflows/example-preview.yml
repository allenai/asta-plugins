name: Example site

# A plain workspace in a subfolder, using this checkout's shipped workflow.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: read

jobs:
  docs:
    uses: ./.github/workflows/workspace-quarto-site.yml
    with:
      site-dir: examples/workspace
      paper-strict: true
      artifact-command: |
        docker run --rm --cap-drop ALL --security-opt no-new-privileges \
          --user "$(id -u):$(id -g)" -e HOME=/tmp \
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
          ghcr.io/allenai/asta:latest-tex bash -e -o pipefail -c '
            export PATH="$(uv tool dir --bin):$PATH"
            uv tool install --force .
            python3 scripts/build-workspace-demo.py examples/workspace/_site/demo
          '
      render-paths: |
        examples/workspace/**
        examples/workspace-demo.patch
        scripts/build-workspace-demo.py
        src/asta/commands/workspace.py
        plugins/asta-tools/skills/workspace/assets/**
        .github/workflows/workspace-quarto-site.yml
        .github/workflows/example-preview.yml

  docs-arm:
    needs: docs
    uses: ./.github/workflows/workspace-quarto-site.yml
    with:
      build-runner: ubuntu-24.04-arm
      site-dir: examples/workspace
      paper-strict: true
      artifact-command: |
        docker run --rm --cap-drop ALL --security-opt no-new-privileges \
          --user "$(id -u):$(id -g)" -e HOME=/tmp \
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
          ghcr.io/allenai/asta:latest-tex bash -e -o pipefail -c '
            export PATH="$(uv tool dir --bin):$PATH"
            uv tool install --force .
            python3 scripts/build-workspace-demo.py examples/workspace/_site/demo
          '
      render-paths: |
        examples/workspace/**
        examples/workspace-demo.patch
        scripts/build-workspace-demo.py
        src/asta/commands/workspace.py
        plugins/asta-tools/skills/workspace/assets/**
        .github/workflows/**

  check-preview:
    name: Example preview browser
    needs: [docs, docs-arm]
    if: always() && github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require successful workspace jobs
        env:
          RESULT: ${{ needs.docs.result }}
        run: test "$RESULT" = success
      - name: Decide whether the preview browser runs
        id: browser
        env:
          RUN: ${{ needs.docs.outputs.rendered == 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        run: echo "run=$RUN" >> "$GITHUB_OUTPUT"
      - if: steps.browser.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: steps.browser.outputs.run == 'true'
        name: Read the published preview from gh-pages
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin gh-pages
          if [ -z "$(git ls-tree FETCH_HEAD "pr-preview/pr-$PR_NUMBER")" ]; then
            echo "::error::No published preview found at pr-preview/pr-$PR_NUMBER"
            exit 1
          fi
          mkdir preview-site
          git archive FETCH_HEAD "pr-preview/pr-$PR_NUMBER" | tar -x -C preview-site
      - if: steps.browser.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - if: steps.browser.outputs.run == 'true'
        name: Install browser checks
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - if: steps.browser.outputs.run == 'true'
        name: Check the preview and What changed in a browser
        working-directory: tests/browser
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node example-preview.mjs ../../preview-site artifacts
      - if: steps.browser.outputs.run == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.browser.outputs.run == 'true'
        name: Check the published main-demo artifact
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          uv run --no-project --with playwright==1.64.1 python -m playwright install chromium
          uv run --no-project --with playwright==1.64.1 python tests/browser/local-what-changed-demo.py --site "preview-site/pr-preview/pr-$PR_NUMBER/demo" tests/browser/artifacts
      - if: steps.browser.outputs.run == 'true' && github.event.pull_request.head.ref == 'example-demo-pr'
        uses: astral-sh/setup-uv@v6
      - if: steps.browser.outputs.run == 'true' && github.event.pull_request.head.ref == 'example-demo-pr'
        name: Check every demo content type in the published preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          uv run --no-project --with playwright==1.64.1 python -m playwright install chromium
          uv run --no-project --with playwright==1.64.1 python tests/browser/local-what-changed-demo.py --site "preview-site/pr-preview/pr-$PR_NUMBER" tests/browser/artifacts
      - if: steps.browser.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: example-preview-screenshots
          path: tests/browser/artifacts
          retention-days: 30
