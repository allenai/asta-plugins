name: Example site

# A plain workspace in a subfolder, using this checkout's shipped workflow: the one
# build of the example site and its demo What changed, checked once in a browser.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_call:
    inputs:
      release-check:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      preview-pr:
        description: Refresh an open PR preview from its head branch
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  pages: read

jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      workspace: ${{ steps.scope.outputs.workspace }}
    steps:
      - uses: actions/checkout@v4
        if: github.event.action != 'closed'
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          ACTION: ${{ github.event.action }}
        run: |
          # Closing only removes the preview; the PR's merge ref may be gone.
          workspace=false
          if [ "$ACTION" != closed ]; then
            workspace=$(make --silent workspace-scope)
          fi
          case "$workspace" in true|false) ;; *) echo "::error::Invalid workspace scope: $workspace"; exit 1;; esac
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
  docs:
    needs: scope
    uses: ./.github/workflows/workspace-quarto-site.yml
    with:
      preview-pr: ${{ inputs.preview-pr || '' }}
      publish: ${{ !inputs.release-check }}
      site-dir: examples/workspace
      paper-strict: true
      artifact-command: |
        docker run --rm --cap-drop ALL --security-opt no-new-privileges \
          --user "$(id -u):$(id -g)" -e HOME=/tmp \
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
          ghcr.io/allenai/asta:latest-tex bash -e -o pipefail -c '
            export PATH="$(uv tool dir --bin):$PATH"
            uv tool install --force .
            make workspace-demo
          '
      render: ${{ needs.scope.outputs.workspace }}

  # Arm runs only before release or on demand; a PR waits on x86 alone.
  docs-arm:
    if: github.event_name == 'workflow_dispatch' || inputs.release-check
    uses: ./.github/workflows/workspace-quarto-site.yml
    with:
      publish: false
      build-runner: ubuntu-24.04-arm
      site-dir: examples/workspace
      paper-strict: true
      artifact-command: |
        docker run --rm --cap-drop ALL --security-opt no-new-privileges \
          --user "$(id -u):$(id -g)" -e HOME=/tmp \
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
          ghcr.io/allenai/asta:latest-tex bash -e -o pipefail -c '
            export PATH="$(uv tool dir --bin):$PATH"
            uv tool install --force .
            make workspace-demo
          '
        make -C "$GITHUB_WORKSPACE" workspace-browser PREVIEW_SITE="$GITHUB_WORKSPACE/examples/workspace/_site" PR_NUMBER=0
      render-paths: "**"

  check-preview:
    name: Example preview browser
    needs: docs
    if: always() && github.event_name != 'push' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require successful workspace jobs
        env:
          RESULT: ${{ needs.docs.result }}
        run: test "$RESULT" = success
      - name: Decide whether the preview browser runs
        id: browser
        env:
          RUN: ${{ needs.docs.outputs.rendered == 'true' }}
        run: echo "run=$RUN" >> "$GITHUB_OUTPUT"
      - if: steps.browser.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: steps.browser.outputs.run == 'true' && needs.docs.outputs.published == 'true'
        name: Read the published preview from gh-pages
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.preview-pr || '0' }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin gh-pages
          if [ "$PR_NUMBER" = 0 ]; then
            # Main has no PR diff. Inspect its published site with the same theme,
            # slide and demo checks; the PR-only URL check below remains separate.
            mkdir -p preview-site/pr-preview/pr-0
            git archive FETCH_HEAD | tar -x --anchored --exclude=pr-preview -C preview-site/pr-preview/pr-0
          else
            if [ -z "$(git ls-tree FETCH_HEAD "pr-preview/pr-$PR_NUMBER")" ]; then
              echo "::error::No published preview found at pr-preview/pr-$PR_NUMBER"
              exit 1
            fi
            mkdir preview-site
            git archive FETCH_HEAD "pr-preview/pr-$PR_NUMBER" | tar -x -C preview-site
          fi
      # Forks and Dependabot cannot publish, but all browser properties still
      # run read-only against the same build's artifact, without another build.
      - if: steps.browser.outputs.run == 'true' && needs.docs.outputs.published != 'true'
        uses: actions/download-artifact@v4
        with:
          name: site-ubuntu-latest
          path: preview-site/pr-preview/pr-${{ github.event.pull_request.number || inputs.preview-pr || '0' }}
      - if: steps.browser.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - if: steps.browser.outputs.run == 'true'
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release
      - if: steps.browser.outputs.run == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.browser.outputs.run == 'true'
        name: Check example preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.preview-pr || '0' }}
        run: make workspace-browser
      - if: steps.browser.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: example-preview-screenshots
          path: tests/browser/artifacts
          retention-days: 30
