name: Example preview

# Previews examples/workspace on a PR the way a workspace's docs.yml does:
# gh-pages pr-preview/pr-<N>/, a comment with the preview and What changed
# links, and removal on close. Only PRs that change what the site renders run
# it. Not a required check; the live root still moves only at a release.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - examples/workspace/**
      - plugins/asta-tools/skills/workspace/assets/**
      - .github/workflows/workspace-quarto-site.yml
      - .github/workflows/example-preview.yml
      - scripts/request-example-pages-build.sh

permissions:
  contents: write
  pull-requests: write
  pages: read

jobs:
  docs:
    uses: ./.github/workflows/workspace-quarto-site.yml
    with:
      site-dir: examples/workspace
      paper-strict: true

  publish-pages:
    needs: docs
    if: >-
      always() && needs.docs.result == 'success'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    concurrency:
      group: example-pages-build
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish preview updates and removals after the Pages switch
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/request-example-pages-build.sh

  check-preview:
    needs: docs
    if: >-
      github.event.action != 'closed'
      && needs.docs.result == 'success'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the published preview from gh-pages
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin gh-pages
          if [ -z "$(git ls-tree FETCH_HEAD "pr-preview/pr-$PR_NUMBER")" ]; then
            echo "::error::No published preview found at pr-preview/pr-$PR_NUMBER"
            exit 1
          fi
          mkdir preview-site
          git archive FETCH_HEAD "pr-preview/pr-$PR_NUMBER" | tar -x -C preview-site
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install browser checks
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check the preview and What changed in a browser
        working-directory: tests/browser
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node example-preview.mjs "../../preview-site/pr-preview/pr-$PR_NUMBER" artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: example-preview-screenshots
          path: tests/browser/artifacts
          retention-days: 30
