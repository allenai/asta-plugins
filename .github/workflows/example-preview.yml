name: Example site

# A plain workspace in a subfolder, using this checkout's shipped workflow: the one
# build of the example site and its demo What changed, checked once in a browser.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      preview-pr:
        description: Refresh an open PR preview from its head branch (used by the release demo)
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  pages: read

jobs:
  docs:
    uses: ./.github/workflows/workspace-quarto-site.yml
    with:
      preview-pr: ${{ inputs.preview-pr || '' }}
      site-dir: examples/workspace
      paper-strict: true
      artifact-command: |
        # The demo PR already carries the patch; its ordinary preview is the demo.
        [ "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" != example-demo-pr ] || exit 0
        docker run --rm --cap-drop ALL --security-opt no-new-privileges \
          --user "$(id -u):$(id -g)" -e HOME=/tmp \
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
          ghcr.io/allenai/asta:latest-tex bash -e -o pipefail -c '
            export PATH="$(uv tool dir --bin):$PATH"
            uv tool install --force .
            python3 scripts/build-workspace-demo.py examples/workspace/_site/demo
          '
      render-paths: |
        examples/workspace/**
        examples/workspace-demo.patch
        scripts/build-workspace-demo.py
        src/asta/commands/workspace.py
        plugins/asta-tools/skills/workspace/assets/**
        .github/workflows/workspace-quarto-site.yml
        .github/workflows/example-preview.yml
        tests/browser/**

  # arm on main and on demand only; a PR waits on x86 alone.
  docs-arm:
    if: github.event_name != 'pull_request' && inputs.preview-pr == ''
    uses: ./.github/workflows/workspace-quarto-site.yml
    with:
      publish: false
      build-runner: ubuntu-24.04-arm
      site-dir: examples/workspace
      paper-strict: true
      artifact-command: |
        # The demo PR already carries the patch; its ordinary preview is the demo.
        [ "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" != example-demo-pr ] || exit 0
        docker run --rm --cap-drop ALL --security-opt no-new-privileges \
          --user "$(id -u):$(id -g)" -e HOME=/tmp \
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
          ghcr.io/allenai/asta:latest-tex bash -e -o pipefail -c '
            export PATH="$(uv tool dir --bin):$PATH"
            uv tool install --force .
            python3 scripts/build-workspace-demo.py examples/workspace/_site/demo
          '
      render-paths: |
        examples/workspace/**
        examples/workspace-demo.patch
        scripts/build-workspace-demo.py
        src/asta/commands/workspace.py
        plugins/asta-tools/skills/workspace/assets/**
        .github/workflows/**

  check-preview:
    name: Example preview browser
    needs: docs
    if: always() && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require successful workspace jobs
        env:
          RESULT: ${{ needs.docs.result }}
        run: test "$RESULT" = success
      - name: Decide whether the preview browser runs
        id: browser
        env:
          RUN: ${{ needs.docs.outputs.rendered == 'true' }}
        run: echo "run=$RUN" >> "$GITHUB_OUTPUT"
      - if: steps.browser.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: steps.browser.outputs.run == 'true' && needs.docs.outputs.published == 'true'
        name: Read the published preview from gh-pages
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.preview-pr || '0' }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin gh-pages
          if [ "$PR_NUMBER" = 0 ]; then
            # Main has no PR diff. Inspect its published site with the same theme,
            # slide and demo checks; the PR-only URL check below remains separate.
            mkdir -p preview-site/pr-preview/pr-0
            git archive FETCH_HEAD | tar -x --anchored --exclude=pr-preview -C preview-site/pr-preview/pr-0
          else
            if [ -z "$(git ls-tree FETCH_HEAD "pr-preview/pr-$PR_NUMBER")" ]; then
              echo "::error::No published preview found at pr-preview/pr-$PR_NUMBER"
              exit 1
            fi
            mkdir preview-site
            git archive FETCH_HEAD "pr-preview/pr-$PR_NUMBER" | tar -x -C preview-site
          fi
      # Forks and Dependabot cannot publish, but all browser properties still
      # run read-only against the same build's artifact, without another build.
      - if: steps.browser.outputs.run == 'true' && needs.docs.outputs.published != 'true'
        uses: actions/download-artifact@v4
        with:
          name: site-ubuntu-latest
          path: preview-site/pr-preview/pr-${{ github.event.pull_request.number || inputs.preview-pr || '0' }}
      - if: steps.browser.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - if: steps.browser.outputs.run == 'true'
        name: Install browser checks
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - if: steps.browser.outputs.run == 'true'
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release
      - if: steps.browser.outputs.run == 'true'
        name: Render slide customization fixtures
        # Match the site's Quarto setup; these HTML fixtures need no TeX image.
        run: python3 tests/browser/render-slides.py tests/browser/fixtures
      - if: steps.browser.outputs.run == 'true'
        name: Check slide geometry and standalone behavior
        working-directory: tests/browser
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.preview-pr || '0' }}
        run: node workspace-slides.mjs "../../preview-site/pr-preview/pr-$PR_NUMBER" artifacts
      - if: steps.browser.outputs.run == 'true'
        name: Check both themes and evidence readability
        working-directory: tests/browser
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.preview-pr || '0' }}
        run: npm test -- "../../preview-site/pr-preview/pr-$PR_NUMBER" artifacts
      - if: steps.browser.outputs.run == 'true' && (github.event_name == 'pull_request' || inputs.preview-pr != '')
        name: Check the preview and What changed in a browser
        working-directory: tests/browser
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.preview-pr || '0' }}
        run: node example-preview.mjs ../../preview-site artifacts
      - if: steps.browser.outputs.run == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.browser.outputs.run == 'true'
        name: Check rendered deck review
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.preview-pr || '0' }}
        run: |
          uv run --no-project --with playwright==1.64.1 python -m playwright install chromium
          uv run --no-project --with playwright==1.64.1 python tests/browser/deck-review.py "preview-site/pr-preview/pr-$PR_NUMBER" tests/browser/artifacts
      - if: steps.browser.outputs.run == 'true'
        name: Check the demo What changed in the published preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.preview-pr || '0' }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          site="preview-site/pr-preview/pr-$PR_NUMBER"
          if [ "$HEAD_BRANCH" != example-demo-pr ]; then site="$site/demo"; fi
          uv run --no-project --with playwright==1.64.1 python tests/browser/local-what-changed-demo.py --site "$site" tests/browser/artifacts
      - if: steps.browser.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: example-preview-screenshots
          path: tests/browser/artifacts
          retention-days: 30
