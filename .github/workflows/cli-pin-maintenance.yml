name: CLI pin maintenance

on:
  workflow_call:
    inputs:
      cli:
        type: string
        required: true
      cli-name:
        type: string
        required: true
      checks:
        type: string
        required: true
      canary-result:
        type: string
        required: true
      version:
        type: string
      setup-failure:
        type: string
      failed-checks:
        type: string
    secrets:
      PIN_BUMP_APP_PRIVATE_KEY:
        required: false

defaults:
  run:
    shell: bash

jobs:
  bump-pin:
    if: github.ref == 'refs/heads/main' && inputs.canary-result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ inputs.cli }}-pin-bump
      queue: max
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false

      - name: Update the pin when the tested release is newer
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
          PIN_FILE: .github/${{ inputs.cli }}-version
          BUMP_BRANCH: automation/${{ inputs.cli }}-pin
        run: |
          main_sha="$(git rev-parse HEAD)"
          if [ "$TESTED_SHA" != "$main_sha" ]; then
            echo "Skipping the pin update: the canary tested $TESTED_SHA and main is now $main_sha." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          current="$(<"$PIN_FILE")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Expected numeric major.minor.patch versions for the canary and pin.'
            exit 1
          fi
          newest="$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n1)"
          if [ "$VERSION" = "$current" ] || [ "$newest" != "$VERSION" ]; then
            echo "Main already pins $current (tested $VERSION)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # An older rerun must also preserve a newer bump awaiting review.
          pending_sha="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f base=main -f "head=${GITHUB_REPOSITORY_OWNER}:$BUMP_BRANCH" \
            --jq 'if length > 1 then error("Multiple open PRs use the pin bump branch.") else .[0].head.sha // empty end')"
          if [ -n "$pending_sha" ]; then
            pending="$(gh api --method GET "repos/$GITHUB_REPOSITORY/contents/$PIN_FILE" \
              -f "ref=$pending_sha" --jq .content | base64 --decode)"
            if [[ ! "$pending" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo '::error::Expected a numeric major.minor.patch version in the pending pin PR.'
              exit 1
            fi
            newest="$(printf '%s\n%s\n' "$pending" "$VERSION" | sort -V | tail -n1)"
            if [ "$VERSION" = "$pending" ] || [ "$newest" != "$VERSION" ]; then
              echo "An open PR already proposes $pending (tested $VERSION)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          echo "$VERSION" > "$PIN_FILE"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Require GitHub App credentials for automatic PR CI
        if: steps.pin.outputs.changed == 'true'
        env:
          PIN_BUMP_APP_ID: ${{ vars.PIN_BUMP_APP_ID }}
          PIN_BUMP_APP_PRIVATE_KEY: ${{ secrets.PIN_BUMP_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$PIN_BUMP_APP_ID" ] || [ -z "$PIN_BUMP_APP_PRIVATE_KEY" ]; then
            echo '::error::Set the PIN_BUMP_APP_ID repository variable and PIN_BUMP_APP_PRIVATE_KEY secret for a GitHub App with Contents and Pull requests write access to this repository.'
            exit 1
          fi

      - name: Mint GitHub App token
        id: app
        if: steps.pin.outputs.changed == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.PIN_BUMP_APP_ID }}
          private-key: ${{ secrets.PIN_BUMP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Verify main still matches the tested commit
        id: freshness
        if: steps.pin.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          main_sha="$(gh api -H 'Cache-Control: no-cache' "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test -n "$main_sha"
          if [ "$TESTED_SHA" != "$main_sha" ]; then
            echo "Skipping publication: the canary tested $TESTED_SHA and main is now $main_sha." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the pin-bump PR
        id: publish
        if: steps.freshness.outputs.current == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ steps.app.outputs.token }}
          base: main
          branch: automation/${{ inputs.cli }}-pin
          add-paths: .github/${{ inputs.cli }}-version
          commit-message: "Bump ${{ inputs.cli-name }} test pin to ${{ inputs.version }}"
          title: "Bump ${{ inputs.cli-name }} test pin to ${{ inputs.version }}"
          body: |
            The weekly ${{ inputs.cli-name }} canary passed on ${{ inputs.version }}: ${{ inputs.checks }}.

            Canary run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  alert:
    needs: bump-pin
    if: >-
      ${{ always() && github.ref == 'refs/heads/main'
          && (inputs.canary-result == 'failure' || needs.bump-pin.result == 'failure') }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ inputs.cli }}-canary-alert
      queue: max
    permissions:
      issues: write
    steps:
      - name: Open one issue per failing version and check set
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_NAME: ${{ inputs.cli-name }}
          VERSION: ${{ inputs.version || 'unknown' }}
          SETUP_FAILURE: ${{ inputs.setup-failure }}
          FAILED_CHECKS: ${{ inputs.failed-checks }}
          BUMP_RESULT: ${{ needs.bump-pin.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$BUMP_RESULT" = failure ]; then
            failures="pin bump"
            detail="The compatibility checks passed. See the pin-bump job for the publishing error."
          else
            failures="${SETUP_FAILURE:-${FAILED_CHECKS%, }}"
            failures="${failures:-unexpected canary failure}"
            detail="See the compatibility check logs for details."
          fi
          title="$CLI_NAME $VERSION canary failed: $failures"
          titles="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" \
            --jq '.[] | select(has("pull_request") | not) | .title')"
          if grep -Fxq -- "$title" <<< "$titles"; then
            echo "Already reported: $title"
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file - <<EOF
          The $CLI_NAME canary kept the current test pin. $detail

          - Version: $VERSION
          - Failure: $failures
          - Run: $RUN_URL
          EOF
