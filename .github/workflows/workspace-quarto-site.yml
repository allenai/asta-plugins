# Scratch probe: production paper step unchanged; site build and deployment omitted.
name: Quarto site
'on':
  workflow_call:
    inputs:
      quarto-version:
        description: Quarto CLI version used to render generated sources
        type: string
        default: release
      artifact-command:
        description: Optional project command after rendering and paper previews,
          before publication
        type: string
        default: ''
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: '0'
    - name: Build paper preview
      id: paper
      continue-on-error: true
      env:
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        WORKFLOW_REF: ${{ job.workflow_ref }}
      run: "if [ -e _site/paper-previews ]; then\n  echo '::error::Quarto output already\
        \ uses paper-previews/; reserve that path for paper previews'\n  exit 1\n\
        fi\nmkdir -p _site/paper-previews\nfail_discovery() {\n  echo \"$1\" > _site/paper-previews/build-failed.txt\n\
        \  echo \"::error::$1\"\n  exit 1\n}\nbase=\"\"\nif [ -n \"$PR_BASE\" ] &&\
        \ ! base=$(git merge-base \"$PR_BASE\" HEAD); then\n  echo '::warning::Could\
        \ not find the PR merge base; publishing current papers without diffs or removals'\n\
        \  base=\"\"\nfi\n# A project's committed scripts/<asset> is a customization\
        \ and wins.\nif git ls-files --error-unmatch scripts/paper-discovery.py >/dev/null\
        \ 2>&1; then\n  echo '::notice::Using the project copy of scripts/paper-discovery.py'\n\
        \  cp scripts/paper-discovery.py /tmp/paper-discovery.py || fail_discovery\
        \ 'Could not copy scripts/paper-discovery.py.'\nelse\n  discovery_script=\"\
        https://raw.githubusercontent.com/${{ job.workflow_repository }}/${{ job.workflow_sha\
        \ }}/plugins/asta-tools/skills/workspace/assets/paper-discovery.py\"\n  curl\
        \ -fsSL \"$discovery_script\" -o /tmp/paper-discovery.py || fail_discovery\
        \ 'Could not download the paper discovery script.'\nfi\ndiscovery=$(python3\
        \ /tmp/paper-discovery.py \"$base\") || fail_discovery 'Could not discover\
        \ paper projects.'\njq -e '(.papers | type == \"array\" and all(.[]; type\
        \ == \"string\")) and (.removed | type == \"array\" and all(.[]; type == \"\
        string\")) and (.warnings | type == \"array\" and all(.[]; type == \"string\"\
        ))' <<< \"$discovery\" >/dev/null || fail_discovery 'Paper discovery returned\
        \ invalid data.'\nmapfile -t papers < <(jq -r '.papers[]' <<< \"$discovery\"\
        )\nmapfile -t removed < <(jq -r '.removed[]' <<< \"$discovery\")\nmapfile\
        \ -t warnings < <(jq -r '.warnings[]' <<< \"$discovery\")\nstatus=0\nif [\
        \ ${#warnings[@]} -gt 0 ]; then\n  printf '%s\\n' \"${warnings[@]}\" > _site/paper-previews/build-failed.txt\n\
        \  status=1\nfi\nfor d in \"${removed[@]}\"; do\n  mkdir -p \"_site/paper-previews/$d\"\
        \n  printf '{\"changed\":true,\"removed\":true}\\n' > \"_site/paper-previews/$d/preview.json\"\
        \ndone\n[ ${#papers[@]} -gt 0 ] || exit \"$status\"\nfail_all() {\n  for d\
        \ in \"${papers[@]}\"; do\n    mkdir -p \"_site/paper-previews/$d\"\n    echo\
        \ \"$1\" > \"_site/paper-previews/$d/build-failed.txt\"\n    [ -f \"_site/paper-previews/$d/preview.json\"\
        \ ] || printf '{\"changed\":false}\\n' > \"_site/paper-previews/$d/preview.json\"\
        \n  done\n  exit 1\n}\n# Build inside the -tex image released with this workflow\
        \ so CI matches\n# the dev container; untagged refs use the newest release.\n\
        [ -n \"$WORKFLOW_REF\" ] || fail_all 'The reusable workflow ref is missing;\
        \ cannot select the LaTeX image.'\ncase \"$WORKFLOW_REF\" in\n  *@refs/tags/v*)\n\
        \    tag=${WORKFLOW_REF##*@refs/tags/}\n    [[ \"$tag\" =~ ^v[0-9A-Za-z._-]+$\
        \ ]] || fail_all \"The workflow tag $tag is not a valid image tag.\"\n   \
        \ tex_image=\"ghcr.io/allenai/asta:$tag-tex\"\n    ;;\n  *)\n    tex_image=ghcr.io/allenai/asta:latest-tex\n\
        \    echo '::warning::An untagged workflow ref uses mutable latest-tex; pin\
        \ a release tag for a matching LaTeX toolchain.'\n    ;;\nesac\n# A tag can\
        \ be called while its validated images are being promoted.\ndf -h /\npull_start=$SECONDS\n\
        for attempt in {1..5}; do\n  if docker pull -q \"$tex_image\"; then break;\
        \ fi\n  [ \"$attempt\" -lt 5 ] || fail_all \"Could not pull the LaTeX image\
        \ $tex_image. For a new release, retry after its Docker promotion workflow\
        \ succeeds.\"\n  echo '::warning::LaTeX image pull failed; retrying in 15\
        \ seconds.'\n  sleep 15\ndone\necho \"LaTeX image pull: $((SECONDS - pull_start))\
        \ seconds\"\ndocker image inspect \"$tex_image\" --format 'LaTeX image digests:\
        \ {{join .RepoDigests \", \"}}'\ndf -h /\nif git ls-files --error-unmatch\
        \ scripts/paper-preview.sh >/dev/null 2>&1; then\n  echo '::notice::Using\
        \ the project copy of scripts/paper-preview.sh'\n  cp scripts/paper-preview.sh\
        \ /tmp/paper-preview.sh || fail_all 'Could not copy scripts/paper-preview.sh.'\n\
        else\n  script=\"https://raw.githubusercontent.com/${{ job.workflow_repository\
        \ }}/${{ job.workflow_sha }}/plugins/asta-tools/skills/workspace/assets/paper-preview.sh\"\
        \n  curl -fsSL \"$script\" -o /tmp/paper-preview.sh || fail_all 'Could not\
        \ download the paper preview script.'\nfi\n# Build every paper even if one\
        \ fails; each failure is recorded on its own.\nfor d in \"${papers[@]}\";\
        \ do\n  if ! docker run --rm --network none --cap-drop ALL --security-opt\
        \ no-new-privileges \\\n      --user \"$(id -u):$(id -g)\" -e HOME=/tmp \\\
        \n      -v \"$PWD:$PWD\" -w \"$PWD\" -v /tmp/paper-preview.sh:/tmp/paper-preview.sh:ro\
        \ \\\n      \"$tex_image\" bash /tmp/paper-preview.sh \"$base\" \"$d\"; then\n\
        \    status=1\n    mkdir -p \"_site/paper-previews/$d\"\n    if [ ! -f \"\
        _site/paper-previews/$d/build-failed.txt\" ]; then\n      {\n        echo\
        \ \"The paper in $d/ failed to build; the rest of the preview was published\
        \ without it.\"\n        echo\n        if [ -f \"$d/build/main.log\" ]; then\
        \ tail -n 200 \"$d/build/main.log\"; fi\n        for log in \"$d\"/build/*.blg;\
        \ do\n          if [ -f \"$log\" ]; then tail -n 100 \"$log\"; fi\n      \
        \  done\n      } > \"_site/paper-previews/$d/build-failed.txt\"\n    fi\n\
        \    [ -f \"_site/paper-previews/$d/preview.json\" ] || printf '{\"changed\"\
        :false}\\n' > \"_site/paper-previews/$d/preview.json\"\n    echo \"::error\
        \ file=$d/main.tex::Paper preview failed; the rest of the preview will still\
        \ publish\"\n  fi\ndone\nexit \"$status\"\n"
    - name: Assert real caller identity and paper output
      env:
        CALLED_REF: ${{ job.workflow_ref }}
        CALLER_REF: ${{ github.workflow_ref }}
      run: 'test "$CALLED_REF" = allenai/asta-plugins/.github/workflows/workspace-quarto-site.yml@refs/heads/tex-disk-probe

        test "$CALLER_REF" = allenai/asta-plugins/.github/workflows/tex-caller-probe.yml@refs/heads/tex-disk-probe

        test -s _site/paper-previews/paper/main.pdf

        printf ''%s\n'' "Called workflow: $CALLED_REF" "Caller: $CALLER_REF" >> "$GITHUB_STEP_SUMMARY"

        '
