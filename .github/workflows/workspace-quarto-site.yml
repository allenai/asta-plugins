# Reusable workflow: build, deploy, and PR-preview a Quarto site on GitHub
# Pages. Scaffolded research projects (see the asta-tools `workspace` skill)
# call this from a thin `docs.yml` stub, so the deploy machinery is maintained
# once here rather than copied into every project.
#
# Contract with the calling repo:
#   - A `make check` target runs the repo's quality gates and renders the site
#     to `_site/` (the workspace skill's Makefile asset provides the baseline;
#     repos add their own gates to that target, never as workflow steps).
#   - The caller grants `contents: write` + `pull-requests: write`; jobs here
#     downscope to least privilege individually.
#   - Full history and PR head refs are fetched before `make check`, for
#     repos whose checks derive content from git history.
name: Quarto site

on:
  workflow_call:
    inputs:
      quarto-version:
        description: Quarto CLI version used to render generated sources
        type: string
        default: release

jobs:
  # Build + quality gates (via `make check`). This is the required status
  # check. Concurrency is keyed per PR (or per branch for main), so a new
  # commit supersedes its own stale build while separate PRs and main never
  # cancel each other.
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      paper: ${{ steps.paper.outcome }}
    permissions:
      contents: read
    concurrency:
      group: pages-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for checks that read git history

      # PR head refs are permanent; fetch them so provenance commits referenced
      # by history-derived checks still resolve.
      - name: Fetch PR refs
        run: git fetch --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pr/*'

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ inputs.quarto-version }}

      # Shared scripts are vendored into each project. Surface (never fail on)
      # drift from the canonical copies shipped at this workflow's own commit.
      - name: Check vendored workspace scripts for drift
        run: |
          for asset in quarto-check.sh wait-for-preview.sh; do
            [ -f "scripts/$asset" ] || continue
            # `github` belongs to the caller; `job.workflow_*` identifies the
            # called workflow and keeps co-located assets on the same commit.
            canonical="https://raw.githubusercontent.com/${{ job.workflow_repository }}/${{ job.workflow_sha }}/plugins/asta-tools/skills/workspace/assets/$asset"
            if curl -fsSL "$canonical" -o "/tmp/$asset.canonical"; then
              if ! diff -u "scripts/$asset" "/tmp/$asset.canonical" > "/tmp/$asset.diff"; then
                echo "::warning::scripts/$asset differs from the workspace skill's canonical copy — re-copy assets/$asset to update (or ignore if intentionally customized)"
                { echo "## $asset drift (vendored → canonical)"; echo '```diff'; cat "/tmp/$asset.diff"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "could not fetch canonical $asset; skipping drift check"
            fi
          done

      # All quality gates live in the repo's `check` Makefile target — the
      # single source of truth shared with local runs, so CI and local can't
      # drift. Warnings are surfaced to the step summary from inside the target.
      - name: Run docs checks
        run: make check

      # A broken paper must not hold back the Quarto preview: publish the rest,
      # say so in the PR comment, and fail the check only after deploy.
      - name: Build paper preview
        id: paper
        continue-on-error: true
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # A paper is any top-level <dir>/main.tex with a latexmkrc beside it;
          # paper/main.tex is always a paper, with or without one.
          papers=()
          for tex in */main.tex; do
            [ -f "$tex" ] || continue
            d=${tex%/main.tex}
            if [ "$d" = paper ] || [ -f "$d/latexmkrc" ] || [ -f "$d/.latexmkrc" ]; then
              papers+=("$d")
              mkdir -p "_site/$d"
              printf '{"changed":false}\n' > "_site/$d/preview.json"
            fi
          done
          removed=()
          if [ -n "$PR_BASE" ]; then
            while IFS= read -r -d '' tex; do
              case "$tex" in */main.tex) ;; *) continue ;; esac
              d=${tex%/main.tex}
              case "$d" in */*) continue ;; esac
              if [ -f "$tex" ] && { [ "$d" = paper ] || [ -f "$d/latexmkrc" ] || [ -f "$d/.latexmkrc" ]; }; then continue; fi
              if [ "$d" = paper ] || git cat-file -e "$PR_BASE:$d/latexmkrc" 2>/dev/null || git cat-file -e "$PR_BASE:$d/.latexmkrc" 2>/dev/null; then removed+=("$d"); fi
            done < <(git ls-tree -rz --name-only "$PR_BASE" 2>/dev/null)
          fi
          for d in "${removed[@]}"; do
            mkdir -p "_site/$d"
            printf '{"changed":true,"removed":true}\n' > "_site/$d/preview.json"
          done
          [ ${#papers[@]} -gt 0 ] || exit 0
          fail_all() {
            for d in "${papers[@]}"; do mkdir -p "_site/$d"; echo "$1" > "_site/$d/build-failed.txt"; done
            exit 1
          }
          sudo apt-get update -qq || fail_all 'Could not update LaTeX package lists.'
          sudo apt-get install -y --no-install-recommends \
            latexmk latexdiff latexml poppler-utils texlive-latex-base \
            texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-bibtex-extra \
            texlive-luatex texlive-xetex texlive-publishers \
            texlive-science texlive-pictures biber || fail_all 'Could not install the LaTeX toolchain.'
          script="https://raw.githubusercontent.com/${{ job.workflow_repository }}/${{ job.workflow_sha }}/plugins/asta-tools/skills/workspace/assets/paper-preview.sh"
          curl -fsSL "$script" -o /tmp/paper-preview.sh || fail_all 'Could not download the paper preview script.'
          base=""
          if [ -n "$PR_BASE" ] && ! base=$(git merge-base "$PR_BASE" HEAD); then
            echo '::warning::Could not find the PR base; publishing the current papers without a diff'
            base=""
          fi
          # Build every paper even if one fails; each failure is recorded on its own.
          status=0
          for d in "${papers[@]}"; do
            if ! bash /tmp/paper-preview.sh "$base" "$d"; then
              status=1
              mkdir -p "_site/$d"
              if [ ! -f "_site/$d/build-failed.txt" ]; then
                {
                  echo "The paper in $d/ failed to build; the rest of the preview was published without it."
                  echo
                  if [ -f "$d/build/main.log" ]; then tail -n 200 "$d/build/main.log"; fi
                  for log in "$d"/build/*.blg; do
                    if [ -f "$log" ]; then tail -n 100 "$log"; fi
                  done
                } > "_site/$d/build-failed.txt"
              fi
              echo "::error file=$d/main.tex::Paper preview failed; the rest of the preview will still publish"
            fi
          done
          exit "$status"

      - name: Prepare Pages artifact
        run: touch _site/.nojekyll  # serve asset dirs verbatim (no Jekyll)

      - name: Upload rendered site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          include-hidden-files: true  # keep .nojekyll

  # Publish: main -> gh-pages root (keeping PR previews); a PR -> a preview under
  # /pr-preview/pr-<N>/ with a link comment. Concurrency is keyed per PR (and
  # separately for main), so main and any PR are always in different groups — a
  # main deploy can't be queued behind or cancelled by a PR's write (including a
  # PR-close cleanup that fires at merge). Concurrent writes from different
  # groups reconcile via rebase-and-retry on push, not a global queue.
  deploy:
    needs: build
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # `pages: read` lets us resolve the site's real served URL from the Pages
      # API (private/internal repos serve from an obfuscated *.pages.github.io
      # domain, not <owner>.github.io/<repo>). Degrades gracefully if absent.
      pages: read
    concurrency:
      group: pages-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Publish to gh-pages
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # First deploy: create gh-pages from the empty tree without touching
          # the main checkout (an orphan checkout here would make the worktree
          # add below fail — a branch can't be checked out twice).
          git fetch origin gh-pages:gh-pages 2>/dev/null \
            || git branch gh-pages "$(git commit-tree "$(git hash-object -t tree /dev/null)" -m "Initialize gh-pages")"
          tmp=$(mktemp -d)
          git worktree add "$tmp" gh-pages

          if [ "${{ github.event_name }}" = "push" ]; then
            # Main deploy: replace the site root, keep pr-preview/.
            find "$tmp" -mindepth 1 -maxdepth 1 ! -name pr-preview ! -name .git -exec rm -rf {} +
            cp -r "$GITHUB_WORKSPACE/_site/." "$tmp/"
          else
            # PR preview: publish under pr-preview/pr-<N>/.
            rm -rf "$tmp/pr-preview/pr-$PR_NUMBER"
            mkdir -p "$tmp/pr-preview/pr-$PR_NUMBER"
            cp -r "$GITHUB_WORKSPACE/_site/." "$tmp/pr-preview/pr-$PR_NUMBER/"

            # "What changed" page: a single link that lands reviewers on exactly
            # the rendered content this PR adds/removes, highlighted inline,
            # instead of the site root to hunt through. The baseline is the site
            # as currently deployed to the gh-pages root (i.e. main), which is
            # already checked out here — so this is a diff of two rendered trees,
            # no re-render. Best-effort: a generator hiccup must not fail an
            # otherwise-good publish.
            set +e
            baseline=$(mktemp -d)
            find "$tmp" -mindepth 1 -maxdepth 1 ! -name pr-preview ! -name .git \
              -exec cp -r {} "$baseline/" \;
            gen="https://raw.githubusercontent.com/${{ job.workflow_repository }}/${{ job.workflow_sha }}/plugins/asta-tools/skills/workspace/assets/what-changed.py"
            if curl -fsSL "$gen" -o /tmp/what-changed.py; then
              python3 /tmp/what-changed.py \
                --old "$baseline" \
                --new "$GITHUB_WORKSPACE/_site" \
                --out "$tmp/pr-preview/pr-$PR_NUMBER/what-changed.html" \
                --title "PR #$PR_NUMBER" \
                || echo "::warning::what-changed page generation failed; preview still published"
            else
              echo "::warning::could not fetch what-changed.py; skipping the diff page"
            fi
            set -e

            # Keep previews out of search indexes. A project Pages site can't use
            # a path-scoped robots.txt (only the host-root one is honored), so
            # inject a noindex meta tag into the preview's pages (main is left
            # indexable).
            find "$tmp/pr-preview/pr-$PR_NUMBER" -name '*.html' -print0 \
              | xargs -0 sed -i 's#<head>#<head><meta name="robots" content="noindex, nofollow">#'
          fi

          cd "$tmp"
          git add -A
          # Always publish a run-ID marker commit. Even byte-identical renders
          # then produce an observable Pages build for readiness checks.
          git commit --allow-empty -m "Deploy ${{ github.event_name }} ${{ github.sha }} (run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do
            git push origin gh-pages && break
            [ "$i" = 5 ] && { echo "::error::could not push gh-pages after 5 attempts"; exit 1; }
            echo "gh-pages moved underneath us — rebasing and retrying ($i/5)"
            git pull --rebase origin gh-pages || { git rebase --abort 2>/dev/null || true; echo "::error::gh-pages rebase conflict"; exit 1; }
          done

          # For a PR, ensure exactly one preview-link comment (create or update),
          # independent of whether the content changed. Best-effort — a comment
          # hiccup shouldn't fail an otherwise-successful publish, so the whole
          # block runs with errexit disabled and closes on a guaranteed success.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            set +e
            # Resolve the site's real base URL from the Pages config. Private and
            # internal repos serve from an obfuscated <random>.pages.github.io
            # domain, NOT <owner>.github.io/<repo>, so hardcoding the latter
            # yields a dead preview link there. Fall back to the canonical form
            # if the Pages API is unavailable (e.g. token lacks `pages: read`).
            base=$(gh api "repos/${{ github.repository }}/pages" --jq '.html_url' 2>/dev/null)
            # On failure (e.g. Pages not configured yet -> 404, or a 5xx),
            # `gh api` prints the raw error body to stdout and never applies
            # --jq, so $base is a non-empty blob of error JSON. Guard on it
            # actually being an https URL, not merely non-empty, before trusting
            # it -- otherwise the error text lands inside the preview link.
            case "$base" in
              https://*) base="${base%/}" ;;
              *) base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" ;;
            esac
            url="$base/pr-preview/pr-$PR_NUMBER/"
            # Link the "what changed" page only if it was actually generated.
            if [ -f "$tmp/pr-preview/pr-$PR_NUMBER/what-changed.html" ]; then
              body=$(printf '📄 Preview: %s\n🔎 What changed: %swhat-changed.html' "$url" "$url")
            else
              body="📄 Preview: $url"
            fi
            # Surface the paper directly; it is otherwise one click deep.
            pr_dir="$tmp/pr-preview/pr-$PR_NUMBER"
            for paper_dir in "$pr_dir"/*/; do
              d=$(basename "$paper_dir")
              [ -f "$paper_dir/preview.json" ] || continue
              encoded=$(python3 -c 'from urllib.parse import quote; import sys; print(quote(sys.argv[1], safe=""))' "$d")
              label="Paper"; [ "$d" = paper ] || label="Paper ($encoded/)"
              if [ -f "$paper_dir/main.pdf" ]; then
                body=$(printf '%s\n📑 %s PDF: %s%s/main.pdf' "$body" "$label" "$url" "$encoded")
              fi
              if [ -f "$paper_dir/html/index.html" ]; then
                body=$(printf '%s\n📄 %s HTML: %s%s/html/index.html' "$body" "$label" "$url" "$encoded")
              elif [ -f "$paper_dir/html/latexml.log" ]; then
                body=$(printf '%s\n⚠️ %s HTML conversion failed: %s%s/html/latexml.log' "$body" "$label" "$url" "$encoded")
              fi
              if [ -f "$paper_dir/main.bbl" ]; then
                body=$(printf '%s\n📚 %s bibliography (arXiv): %s%s/main.bbl' "$body" "$label" "$url" "$encoded")
              fi
              if [ -f "$paper_dir/what-changed.pdf" ]; then
                body=$(printf '%s\n🖍️ %s PDF diff: %s%s/what-changed.pdf' "$body" "$label" "$url" "$encoded")
              fi
              if [ -f "$paper_dir/html-diff/index.html" ] && grep -q '"html_diff":true' "$paper_dir/preview.json"; then
                body=$(printf '%s\n🔎 %s HTML diff: %s%s/html-diff/index.html' "$body" "$label" "$url" "$encoded")
              elif [ -f "$paper_dir/html-diff/latexml.log" ]; then
                body=$(printf '%s\n⚠️ %s HTML diff conversion failed: %s%s/html-diff/latexml.log' "$body" "$label" "$url" "$encoded")
              fi
              if [ -f "$paper_dir/build-failed.txt" ]; then
                body=$(printf '%s\n⚠️ %s build failed (preview published without it): %s%s/build-failed.txt' "$body" "$label" "$url" "$encoded")
              fi
              if [ -f "$paper_dir/preview.json" ] && grep -q '"removed":true' "$paper_dir/preview.json"; then
                body=$(printf '%s\n🗑️ %s removed' "$body" "$label")
              fi
            done
            # Guard the read: it runs the same set of transient failure modes as
            # the writes below (a 5xx returns an HTML body that --jq can't parse),
            # so an unguarded assignment would abort the step mid-publish.
            existing=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
              --jq 'map(select(.body | startswith("📄 Preview:"))) | .[0].id // empty' 2>/dev/null)
            if [ -n "$existing" ]; then
              gh api "repos/${{ github.repository }}/issues/comments/$existing" -X PATCH -f body="$body" >/dev/null \
                || echo "::warning::could not update preview comment"
            else
              gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null \
                || echo "::warning::could not create preview comment"
            fi
            set -e
          fi


  # Report a paper failure even if publishing is skipped or fails first.
  paper-gate:
    needs: [build, deploy]
    if: always() && needs.build.outputs.paper == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Fail the check if the paper did not build
        run: |
          echo "::error::The paper failed to build. See the build job's 'Build paper preview' log."
          exit 1

  # Remove a PR's preview when the PR closes. Shares that PR's concurrency group
  # (keyed on the PR number) so it cancels any still-running build/deploy for the
  # PR first — otherwise a late deploy could recreate the preview after removal.
  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Remove PR preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages 2>/dev/null || exit 0
          tmp=$(mktemp -d)
          git worktree add "$tmp" gh-pages
          rm -rf "$tmp/pr-preview/pr-$PR_NUMBER"
          cd "$tmp"
          git add -A
          if git diff --cached --quiet; then echo "no preview to remove"; exit 0; fi
          git commit -m "Remove preview for PR #$PR_NUMBER"
          for i in 1 2 3 4 5; do
            git push origin gh-pages && break
            [ "$i" = 5 ] && { echo "::error::could not push gh-pages after 5 attempts"; exit 1; }
            echo "gh-pages moved underneath us — rebasing and retrying ($i/5)"
            git pull --rebase origin gh-pages || { git rebase --abort 2>/dev/null || true; echo "::error::gh-pages rebase conflict"; exit 1; }
          done
