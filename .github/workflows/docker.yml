name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: asta
            suffix: ''
          - target: tex
            suffix: '-tex'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/allenai/asta:sha-${{ github.sha }}-run-${{ github.run_id }}${{ matrix.suffix }}

  verify:
    if: github.ref == 'refs/heads/main'
    needs: publish
    uses: ./.github/workflows/devcontainer-smoke.yml
    with:
      image-tag-prefix: ghcr.io/allenai/asta:sha-${{ github.sha }}-run-${{ github.run_id }}

  promote:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check tag and validated main build
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo 'Expected a final or rc version tag' >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/docker.yml/runs?head_sha=$GITHUB_SHA&branch=main&status=success" \
            | jq -er --arg sha "$GITHUB_SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | sort_by(.run_started_at) | last | .id')
          echo "candidate_prefix=sha-$GITHUB_SHA-run-$run" >> "$GITHUB_OUTPUT"
      - name: Promote validated images
        env:
          CANDIDATE_PREFIX: ${{ steps.candidate.outputs.candidate_prefix }}
        run: |
          declare -A sources
          for target in asta tex; do
            image=ghcr.io/allenai/asta
            suffix=''
            if [ "$target" = tex ]; then suffix=-tex; fi
            candidate="$image:$CANDIDATE_PREFIX$suffix"
            digest=$(docker buildx imagetools inspect "$candidate" --format '{{json .Manifest}}' | jq -er .digest)
            case "$digest" in sha256:*) ;; *) exit 1 ;; esac
            sources["$target"]="$image@$digest"
          done
          for target in asta tex; do
            suffix=''
            if [ "$target" = tex ]; then suffix=-tex; fi
            docker buildx imagetools create -t "$image:$GITHUB_REF_NAME$suffix" "${sources[$target]}"
          done
          for target in asta tex; do
            suffix=''
            if [ "$target" = tex ]; then suffix=-tex; fi
            expected="${sources[$target]##*@}"
            actual=$(docker buildx imagetools inspect "$image:$GITHUB_REF_NAME$suffix" --format '{{json .Manifest}}' | jq -er .digest)
            test "$actual" = "$expected"
          done
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            for target in asta tex; do
              suffix=''
              if [ "$target" = tex ]; then suffix=-tex; fi
              docker buildx imagetools create -t "$image:latest$suffix" "${sources[$target]}"
              expected="${sources[$target]##*@}"
              actual=$(docker buildx imagetools inspect "$image:latest$suffix" --format '{{json .Manifest}}' | jq -er .digest)
              test "$actual" = "$expected"
            done
          fi
