name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: asta
            suffix: ''
          - target: tex
            suffix: '-tex'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          push: true
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/allenai/asta:sha-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ matrix.suffix }}
      - name: Record published index digest
        run: echo '${{ steps.build.outputs.digest }}' > "$RUNNER_TEMP/published-digest"
      - uses: actions/upload-artifact@v4
        with:
          name: published-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/published-digest
          if-no-files-found: error

  verify:
    if: github.ref == 'refs/heads/main'
    needs: publish
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/devcontainer-smoke.yml
    with:
      image-tag-prefix: ghcr.io/allenai/asta:sha-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}

  promote:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: docker-release-promote
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check tag and validated main build
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo 'Expected a final or rc version tag' >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          run=''
          for attempt in {1..60}; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/docker.yml/runs?head_sha=$GITHUB_SHA&branch=main&per_page=100")
            run=$(jq -r --arg sha "$GITHUB_SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .head_branch == "main" and .conclusion == "success")] | sort_by(.run_started_at) | (last // empty) | "\(.id) \(.run_attempt)"' <<< "$runs")
            if [ -n "$run" ]; then break; fi
            if [ "$attempt" -gt 4 ] && jq -e --arg sha "$GITHUB_SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .head_branch == "main")] | length > 0 and all(.[]; .status == "completed")' \
              <<< "$runs" >/dev/null; then
              echo 'Main build for tag commit completed without success' >&2
              exit 1
            fi
            sleep 15
          done
          test -n "$run" || { echo 'Timed out waiting for a successful main build' >&2; exit 1; }
          read -r run_id run_attempt <<< "$run"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"
      - name: Promote validated images
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ steps.candidate.outputs.run_id }}
          CANDIDATE_ATTEMPT: ${{ steps.candidate.outputs.run_attempt }}
        run: |
          set -euo pipefail
          image=ghcr.io/allenai/asta
          declare -A sources
          for target in asta tex; do
            gh run download "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" \
              --name "published-$target-attempt-$CANDIDATE_ATTEMPT" --dir "$RUNNER_TEMP/published-$target"
            digest=$(cat "$RUNNER_TEMP/published-$target/published-digest")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            test "$(docker buildx imagetools inspect "$image@$digest" --format '{{json .Manifest}}' | jq -er .digest)" = "$digest"
            sources["$target"]="$image@$digest"
          done
          for target in asta tex; do
            suffix=''
            if [ "$target" = tex ]; then suffix=-tex; fi
            docker buildx imagetools create -t "$image:$GITHUB_REF_NAME$suffix" "${sources[$target]}"
          done
          for target in asta tex; do
            suffix=''
            if [ "$target" = tex ]; then suffix=-tex; fi
            expected="${sources[$target]##*@}"
            actual=$(docker buildx imagetools inspect "$image:$GITHUB_REF_NAME$suffix" --format '{{json .Manifest}}' | jq -er .digest)
            test "$actual" = "$expected"
          done
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            git fetch --tags --force origin
            newest=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            if [ "$GITHUB_REF_NAME" != "$newest" ]; then
              echo "Skipping latest: $newest is newer than $GITHUB_REF_NAME"
              exit 0
            fi
            for target in asta tex; do
              suffix=''
              if [ "$target" = tex ]; then suffix=-tex; fi
              docker buildx imagetools create -t "$image:latest$suffix" "${sources[$target]}"
              expected="${sources[$target]##*@}"
              actual=$(docker buildx imagetools inspect "$image:latest$suffix" --format '{{json .Manifest}}' | jq -er .digest)
              test "$actual" = "$expected"
            done
          fi
