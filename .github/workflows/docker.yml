name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']

# Pushes to main publish :main / :main-tex for pre-release validation; only a
# final vX.Y.Z tag moves :latest, which every new devcontainer and eval pulls.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  validate:
    uses: ./.github/workflows/devcontainer-smoke.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: asta
            suffix: ''
          - target: tex
            suffix: '-tex'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/allenai/asta:${{ github.ref_name }}${{ matrix.suffix }}
            ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && format('ghcr.io/allenai/asta:latest{0}', matrix.suffix) || '' }}
