name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: asta
            suffix: ''
          - target: tex
            suffix: '-tex'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          push: true
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/allenai/asta:sha-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ matrix.suffix }}
      - name: Record published index digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ghcr.io/allenai/asta:sha-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}${{ matrix.suffix }}
        run: |
          jq -n --arg digest "$DIGEST" --arg tag "$TAG" --arg revision "$GITHUB_SHA" \
            '{digest: $digest, tag: $tag, revision: $revision}' > "$RUNNER_TEMP/published.json"
      - uses: actions/upload-artifact@v4
        with:
          name: published-${{ matrix.target }}
          path: ${{ runner.temp }}/published.json
          if-no-files-found: error
          overwrite: true

  verify:
    if: github.ref == 'refs/heads/main'
    needs: publish
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/devcontainer-smoke.yml
    with:
      published-images: true

  promote:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: docker-release-promote-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 100
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check tag and validated main build
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo 'Expected a final or rc version tag' >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          run=''
          for attempt in {1..360}; do
            if ! runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/docker.yml/runs?head_sha=$GITHUB_SHA&branch=main&per_page=100"); then
              sleep 15
              continue
            fi
            run=$(jq -r --arg sha "$GITHUB_SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .head_branch == "main" and .conclusion == "success")] | sort_by(.run_started_at) | (last // empty) | .id // empty' <<< "$runs")
            if [ -n "$run" ]; then break; fi
            if [ "$attempt" -ge 8 ] && jq -e '.total_count == 0' <<< "$runs" >/dev/null; then
              echo 'No main-push image build exists for this commit; tag a commit with its own main push run' >&2
              exit 1
            fi
            if [ "$attempt" -gt 4 ] && jq -e --arg sha "$GITHUB_SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .head_branch == "main")] | length > 0 and all(.[]; .status == "completed")' \
              <<< "$runs" >/dev/null; then
              echo 'Main build for tag commit completed without success' >&2
              exit 1
            fi
            sleep 15
          done
          test -n "$run" || { echo 'Timed out waiting for a successful main build' >&2; exit 1; }
          echo "run_id=$run" >> "$GITHUB_OUTPUT"
      - name: Promote validated images
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ steps.candidate.outputs.run_id }}
        run: |
          set -euo pipefail
          image=ghcr.io/allenai/asta
          declare -A sources
          for target in asta tex; do
            if ! gh run download "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" \
              --name "published-$target" --dir "$RUNNER_TEMP/published-$target"; then
              echo 'Validated build artifacts are unavailable; release within the artifact retention window' >&2
              exit 1
            fi
            manifest="$RUNNER_TEMP/published-$target/published.json"
            digest=$(jq -er .digest "$manifest")
            tag=$(jq -er .tag "$manifest")
            test "$(jq -er .revision "$manifest")" = "$GITHUB_SHA"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            test "$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -er .digest)" = "$digest"
            test "$(docker buildx imagetools inspect "$image@$digest" --format '{{json .Manifest}}' | jq -er .digest)" = "$digest"
            docker pull "$image@$digest"
            test "$(docker image inspect "$image@$digest" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
            sources["$target"]="$image@$digest"
          done
          for target in asta tex; do
            suffix=''
            if [ "$target" = tex ]; then suffix=-tex; fi
            docker buildx imagetools create -t "$image:$GITHUB_REF_NAME$suffix" "${sources[$target]}"
          done
          for target in asta tex; do
            suffix=''
            if [ "$target" = tex ]; then suffix=-tex; fi
            expected="${sources[$target]##*@}"
            actual=$(docker buildx imagetools inspect "$image:$GITHUB_REF_NAME$suffix" --format '{{json .Manifest}}' | jq -er .digest)
            test "$actual" = "$expected"
          done

  latest-ref:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc.')
    needs: promote
    runs-on: ubuntu-latest
    concurrency:
      group: docker-release-latest-ref
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point the latest branch at the highest published final release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image=ghcr.io/allenai/asta
          git fetch --tags --force origin
          newest=''
          while read -r version; do
            if docker buildx imagetools inspect "$image:$version" >/dev/null 2>&1 && \
               docker buildx imagetools inspect "$image:$version-tex" >/dev/null 2>&1; then
              newest="$version"
              break
            fi
          done < <(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -Vr)
          test -n "$newest" || { echo 'No complete final release pair is published' >&2; exit 1; }
          sha=$(git rev-list -n 1 "$newest")
          test -n "$sha"
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/latest" --jq .object.sha)
          current=$(git tag --points-at "$current_sha" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -Vr | head -n 1)
          test -n "$current" || { echo 'The latest branch does not point at a final release' >&2; exit 1; }
          highest=$(printf '%s\n%s\n' "$current" "$newest" | sort -V | tail -n 1)
          if [ "$highest" = "$current" ]; then
            echo "latest branch already at $current"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$current_sha" "$sha"; then
            echo "Cannot advance latest from $current to $newest: release is not a descendant of the current latest commit. Merge the release into main and tag that commit." >&2
            exit 1
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/latest" -f sha="$sha" -F force=false >/dev/null
          echo "latest branch -> $newest ($sha)"

  latest:
    needs: latest-ref
    runs-on: ubuntu-latest
    concurrency:
      group: docker-release-latest-images
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point latest at the selected final release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image=ghcr.io/allenai/asta
          git fetch --tags --force origin
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/latest" --jq .object.sha)
          newest=$(git tag --points-at "$sha" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -Vr | head -n 1)
          test -n "$newest" || { echo 'The latest branch does not point at a final release' >&2; exit 1; }
          for suffix in '' -tex; do
            digest=$(docker buildx imagetools inspect "$image:$newest$suffix" --format '{{json .Manifest}}' | jq -er .digest)
            docker buildx imagetools create -t "$image:latest$suffix" "$image@$digest"
            test "$(docker buildx imagetools inspect "$image:latest$suffix" --format '{{json .Manifest}}' | jq -er .digest)" = "$digest"
          done
