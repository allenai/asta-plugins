name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      build-runner:
        type: string
        default: ubuntu-latest
  pull_request:
    branches: [main]

jobs:
  code-quality:
    # x86 for every build-runner: these checks read source, so the machine
    # can't change their result, and the shellcheck action installs an x86_64
    # binary that can't run on an arm runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Check formatting
        run: make format-check

      - name: lint
        run: make lint

      - name: Lint shell scripts with shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts ./plugins/asta-tools/hooks ./plugins/asta-tools/skills/workspace/assets'

      - name: Check skill frontmatter against Agent Skills spec
        run: make check-skills

  test:
    runs-on: ${{ inputs.build-runner || 'ubuntu-latest' }}
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      DISABLE_AUTOUPDATER: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked CLI tools
        run: bash scripts/install-ci-clis.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run tests
        env:
          ASTA_TEST_CLAUDE_PLUGIN_DEPS: "1"
        run: make test-plugins

  tests-ok:
    # One required check that keeps its name when the Python matrix changes; it
    # also gates the install and model-visible skill-description checks.
    needs: [test, plugin-install]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "test: $TEST_RESULT, plugin-install: $INSTALL_RESULT"
          test "$TEST_RESULT" = success && test "$INSTALL_RESULT" = success
        env:
          TEST_RESULT: ${{ needs.test.result }}
          INSTALL_RESULT: ${{ needs.plugin-install.result }}

  docker:
    runs-on: ${{ inputs.build-runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Pin base image to its current digest
        run: |
          context=$(scripts/base-image-context.sh)
          echo "DOCKER_BUILD_FLAGS=--build-context $context" >> "$GITHUB_ENV"

      - name: Smoke-test image
        run: make docker-test

      - name: Test skill discovery
        run: make docker-test-skills

  plugin-install:
    # Verify `npx plugins add` installs the plugins into Claude Code and Codex.
    # No API auth required. Also verify both model-visible skill lists.
    runs-on: ${{ inputs.build-runner || 'ubuntu-latest' }}
    permissions:
      contents: read
    env:
      DISABLE_AUTOUPDATER: "1"
      PLUGINS_CLI_BIN: ${{ github.workspace }}/.github/ci-tools/node_modules/.bin/plugins
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked CLI tools
        run: bash scripts/install-ci-clis.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Verify install into Claude Code
        run: bash scripts/verify-plugin-install.sh claude-code

      - name: Verify install into Codex
        run: bash scripts/verify-plugin-install.sh codex
