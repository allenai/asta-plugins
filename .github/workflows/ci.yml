name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CLAUDE_CODE_TEST_VERSION: "2.1.283"

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Check formatting
        run: make format-check

      - name: lint
        run: make lint

      - name: Lint shell scripts with shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts ./plugins/asta-tools/hooks ./plugins/asta-tools/skills/workspace/assets'

      - name: Check skill frontmatter against Agent Skills spec
        run: make check-skills

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_TEST_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run tests
        env:
          ASTA_TEST_CLAUDE_PLUGIN_DEPS: "1"
          # workspace-test runs these in parallel processes.
          PYTEST_ADDOPTS: >-
            --ignore-glob=tests/test_workspace_*.py
            --ignore-glob=tests/test_overleaf_*.py
            --ignore=tests/test_example_workspace_workflow.py
        run: make test

  # Only workspace/Overleaf tests use process parallelism; other plugins keep
  # their existing make test invocation and execution model.
  workspace-test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run workspace and Overleaf tests in four workers
        run: |
          uv run --extra test --with pytest-xdist==3.8.0 pytest -v -n 4 \
            tests/test_workspace_*.py tests/test_overleaf_*.py tests/test_example_workspace_workflow.py

  dom-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/dom/package-lock.json

      - name: Install DOM test dependencies
        working-directory: tests/dom
        run: npm ci

      - name: Exercise what-changed folding in a DOM
        working-directory: tests/dom
        run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pin base image to its current digest
        run: |
          context=$(scripts/base-image-context.sh)
          echo "DOCKER_BUILD_FLAGS=--build-context $context" >> "$GITHUB_ENV"

      - name: Smoke-test image
        run: make docker-test

      - name: Test skill discovery
        run: make docker-test-skills

  plugin-install:
    # Verify `npx plugins add` installs the plugins into Claude Code and Codex.
    # No API auth required — only checks the installed files land correctly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_TEST_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Verify install into Claude Code
        run: bash scripts/verify-plugin-install.sh claude-code

      - name: Verify install into Codex
        run: bash scripts/verify-plugin-install.sh codex
