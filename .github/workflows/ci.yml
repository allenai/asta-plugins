name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CLAUDE_CODE_TEST_VERSION: "2.1.283"

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Check formatting
        run: make format-check

      - name: lint
        run: make lint

      - name: Lint shell scripts with shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts ./plugins/asta-tools/hooks ./plugins/asta-tools/skills/workspace/assets'

      - name: Check skill frontmatter against Agent Skills spec
        run: make check-skills

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_TEST_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run tests
        env:
          ASTA_TEST_CLAUDE_PLUGIN_DEPS: "1"
        run: make test

  # Temporary: repeat the whole suite as `make test` runs it, until the
  # intermittent Overleaf clone test fails and prints git's stderr.
  overleaf-clone-flake:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_TEST_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Repeat the suite until the clone test fails
        env:
          ASTA_TEST_CLAUDE_PLUGIN_DEPS: "1"
        run: |
          deadline=$((SECONDS + 100 * 60))
          i=0
          while [ $SECONDS -lt $deadline ]; do
            i=$((i + 1))
            echo "::group::suite run $i"
            if make test > suite.log 2>&1; then
              echo "::endgroup::"
              echo "run $i passed"
              continue
            fi
            echo "::endgroup::"
            if grep -q "FAILED.*test_pull_recognizes_publications_with_equivalent_url" suite.log; then
              echo "run $i: equivalent-URL test failed"
              sed -n '/= FAILURES =/,$p' suite.log
              exit 1
            fi
            echo "run $i failed elsewhere; continuing"
            grep FAILED suite.log || tail -50 suite.log
          done
          echo "no equivalent-URL failure in $i suite runs"

  dom-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/dom/package-lock.json

      - name: Install DOM test dependencies
        working-directory: tests/dom
        run: npm ci

      - name: Exercise what-changed folding in a DOM
        working-directory: tests/dom
        run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pin base image to its current digest
        run: |
          context=$(scripts/base-image-context.sh)
          echo "DOCKER_BUILD_FLAGS=--build-context $context" >> "$GITHUB_ENV"

      - name: Smoke-test image
        run: make docker-test

      - name: Test skill discovery
        run: make docker-test-skills

  plugin-install:
    # Verify `npx plugins add` installs the plugins into Claude Code and Codex.
    # No API auth required — only checks the installed files land correctly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_TEST_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Verify install into Claude Code
        run: bash scripts/verify-plugin-install.sh claude-code

      - name: Verify install into Codex
        run: bash scripts/verify-plugin-install.sh codex
