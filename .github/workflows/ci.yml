name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      build-runner:
        type: string
        default: ubuntu-latest
  pull_request:
    branches: [main]

jobs:
  code-quality:
    # x86 for every build-runner: these checks read source, so the machine
    # can't change their result, and the shellcheck action installs an x86_64
    # binary that can't run on an arm runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Reject automated CLI pin downgrades
        if: >-
          ${{ github.event_name == 'pull_request'
              && github.event.pull_request.head.repo.full_name == github.repository
              && (github.head_ref == 'automation/claude-code-pin'
                  || github.head_ref == 'automation/codex-pin') }}
        env:
          PIN_FILE: .github/${{ github.head_ref == 'automation/claude-code-pin' && 'claude-code' || 'codex' }}-version
        run: |
          # The first parent of the checked-out PR merge commit is the base.
          current="$(git show "HEAD^1:$PIN_FILE")"
          proposed="$(<"$PIN_FILE")"
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! "$proposed" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected numeric major.minor.patch versions in $PIN_FILE."
            exit 1
          fi
          newest="$(printf '%s\n%s\n' "$current" "$proposed" | sort -V | tail -n1)"
          if [[ "$newest" != "$proposed" ]]; then
            echo "::error::Automated update would downgrade $PIN_FILE from $current to $proposed."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Check formatting
        run: make format-check

      - name: lint
        run: make lint

      - name: Lint shell scripts with shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts ./plugins/asta-tools/hooks ./plugins/asta-tools/skills/workspace/assets'

      - name: Check skill frontmatter against Agent Skills spec
        run: make check-skills

  test:
    runs-on: ${{ inputs.build-runner || 'ubuntu-latest' }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      DISABLE_AUTOUPDATER: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code CLI
        run: bash scripts/install-pinned-claude-code.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run tests
        env:
          ASTA_TEST_CLAUDE_PLUGIN_DEPS: "1"
        run: make test-plugins

  tests-ok:
    # One check for main to require that keeps its name when the Python matrix changes.
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "test: $RESULT"
          test "$RESULT" = success
        env:
          RESULT: ${{ needs.test.result }}

  docker:
    runs-on: ${{ inputs.build-runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Pin base image to its current digest
        run: |
          context=$(scripts/base-image-context.sh)
          echo "DOCKER_BUILD_FLAGS=--build-context $context" >> "$GITHUB_ENV"

      - name: Smoke-test image
        run: make docker-test

      - name: Test skill discovery
        run: make docker-test-skills

  plugin-install:
    # Verify `npx plugins add` installs the plugins into Claude Code and Codex.
    # No API auth required. Also verify both model-visible skill lists.
    runs-on: ${{ inputs.build-runner || 'ubuntu-latest' }}
    env:
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: bash scripts/install-pinned-claude-code.sh

      - name: Install Codex CLI
        run: bash scripts/install-pinned-codex.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Verify install into Claude Code
        run: bash scripts/verify-plugin-install.sh claude-code

      - name: Verify install into Codex
        run: bash scripts/verify-plugin-install.sh codex
