name: Example workspace
on:
  pull_request:
  workflow_call:
    inputs:
      ref-name:
        type: string
        required: true
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: example-workspace-${{ github.event.pull_request.number || inputs.ref-name || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      workspace: ${{ steps.scope.outputs.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          workspace=$(make --silent workspace-scope)
          case "$workspace" in true|false) ;; *) echo "::error::Invalid workspace scope: $workspace"; exit 1;; esac
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
  python:
    needs: scope
    if: github.event_name != 'pull_request' || needs.scope.outputs.workspace == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
        runner: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "ubuntu-24.04-arm"]') }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make test-workspace WORKSPACE_SHARD=${{ matrix.shard }} WORKSPACE_SHARDS=8
  tools:
    needs: scope
    if: github.event_name != 'pull_request' || needs.scope.outputs.workspace == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "ubuntu-24.04-arm"]') }}
    container:
      image: ghcr.io/allenai/asta:${{ inputs.ref-name && format('{0}-tex', inputs.ref-name) || 'latest-tex' }}
    env:
      ASTA_WORKSPACE_RESOLVED_SHA: ${{ github.sha }}
      ASTA_WORKSPACE_RESOLVED_REPOSITORY: ${{ github.repository }}
      PLAYWRIGHT_BROWSERS_PATH: /tmp/asta-test-chromium
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make check-workspace-tools
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-local-${{ matrix.runner }}
          path: tests/browser/artifacts
  comparison:
    needs: scope
    if: github.event_name != 'pull_request' || needs.scope.outputs.workspace == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        case: [prose, metadata, slide, quote, bibliography, config, image, new, deleted, renamed, paper-bibliography, paper, include]
        runner: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "ubuntu-24.04-arm"]') }}
    container:
      image: ghcr.io/allenai/asta:${{ inputs.ref-name && format('{0}-tex', inputs.ref-name) || 'latest-tex' }}
    env:
      ASTA_WORKSPACE_RESOLVED_SHA: ${{ github.sha }}
      ASTA_WORKSPACE_RESOLVED_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          uv tool install --force .
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - run: make workspace-compare WORKSPACE_CASE=${{ matrix.case }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison-${{ matrix.case }}-${{ matrix.runner }}
          path: tests/browser/artifacts/differential
  dom:
    needs: scope
    if: github.event_name != 'pull_request' || needs.scope.outputs.workspace == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "ubuntu-24.04-arm"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: make workspace-dom
