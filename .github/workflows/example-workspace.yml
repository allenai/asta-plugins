name: Example workspace

# Builds examples/workspace in the published -tex image. Releases call this after
# `latest` moves and deploy only a passing build; PRs also check shared assets.
# The check is not required.
on:
  workflow_call:
    inputs:
      ref-name:
        description: Final release tag whose -tex image and assets build the demo
        type: string
        required: true
  pull_request:
    paths:
      - examples/workspace/**
      - .asta/overleaf/examples/workspace/**
      - .github/workflows/example-workspace.yml
      - plugins/asta-tools/skills/workspace/assets/**
      - tests/test_example_workspace_workflow.py
      - tests/browser/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: example-workspace-${{ github.event.pull_request.number || inputs.ref-name || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/allenai/asta:${{ inputs.ref-name && format('{0}-tex', inputs.ref-name) || 'latest-tex' }}
    defaults:
      run:
        working-directory: examples/workspace
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and validate the example and its edited demo
        shell: bash
        env:
          ASTA_EXAMPLE_REF: ${{ inputs.ref-name || github.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make check
          make preview-artifact-check
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Render slide customization fixtures
        run: python3 ../../tests/browser/render-slides.py ../../tests/browser/fixtures
      - uses: actions/upload-artifact@v4
        with:
          name: example-workspace-site
          path: examples/workspace/_site
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-slide-fixtures
          path: tests/browser/fixtures
          retention-days: 30
      - if: inputs.ref-name != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples/workspace/_site

  theme:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: example-workspace-site
          path: examples/workspace/_site
      - uses: actions/download-artifact@v4
        with:
          name: workspace-slide-fixtures
          path: tests/browser/fixtures
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install browser checks
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check slide geometry and standalone behavior
        working-directory: tests/browser
        run: node workspace-slides.mjs ../../examples/workspace/_site artifacts
      - name: Check both themes and evidence readability
        working-directory: tests/browser
        run: npm test -- ../../examples/workspace/_site artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-theme-screenshots
          path: tests/browser/artifacts
          retention-days: 30

  deploy:
    needs: [build, theme]
    if: inputs.ref-name != ''
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      current: ${{ steps.release.outputs.current }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Check after acquiring the Pages lock: an older build may finish last.
      - name: Check that this is still the newest final release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref-name }}
        run: |
          set -euo pipefail
          tags=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/tags?per_page=100")
          newest=$(jq -er '[.[][] | .name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))]
            | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | last // empty' <<< "$tags")
          if [ "$REF" = "$newest" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo "Skipping $REF: newest final release is $newest"
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi
      # The administrator changes the source only after the first release root
      # exists. Later releases must stop using Actions deployment in branch mode.
      - name: Read the configured Pages publication mode
        id: source
        if: steps.release.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          config=$(gh api "repos/$GITHUB_REPOSITORY/pages") || {
            echo '::error::Could not read the Pages publication mode'
            exit 1
          }
          mode=$(jq -er 'if .build_type == "workflow" then "workflow"
            elif .build_type == "legacy" and .source.branch == "gh-pages" and .source.path == "/" then "legacy"
            else error("Expected Actions deployment or the gh-pages root") end' <<< "$config") || {
            echo '::error::Unsupported Pages source; leaving its configuration unchanged'
            exit 1
          }
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - id: deployment
        if: steps.release.outputs.current == 'true' && steps.source.outputs.mode == 'workflow'
        uses: actions/deploy-pages@v4

  # Write the release's build to the gh-pages root, keeping pr-preview/,
  # so Pages can serve the gh-pages branch that example-preview.yml publishes
  # PR previews to. Pages keeps serving the Actions deployment until switched.
  publish-gh-pages:
    needs: [build, theme, deploy]
    if: inputs.ref-name != '' && needs.deploy.result == 'success' && needs.deploy.outputs.current == 'true'
    runs-on: ubuntu-latest
    concurrency:
      # Serialize explicit build requests with the example's PR publisher.
      group: example-pages-build
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pages: write
    outputs:
      root: ${{ steps.root.outcome }}
      pages: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: example-workspace-site
          path: _site
      # Recheck under this job's publication lock: a newer release may have
      # published while this run waited after its earlier deploy job.
      - name: Check that this is still the newest final release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref-name }}
        run: |
          set -euo pipefail
          tags=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/tags?per_page=100")
          newest=$(jq -er '[.[][] | .name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))]
            | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | last // empty' <<< "$tags")
          if [ "$REF" = "$newest" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo "Skipping $REF: newest final release is $newest"
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the release build to the gh-pages root
        id: root
        if: steps.release.outputs.current == 'true'
        env:
          REF: ${{ inputs.ref-name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages:gh-pages
          else
            status=$?
            if [ "$status" != 2 ]; then
              echo '::error::Could not determine whether gh-pages exists'
              exit "$status"
            fi
            git branch gh-pages "$(git commit-tree "$(git hash-object -t tree /dev/null)" -m "Initialize gh-pages")"
          fi
          tmp=$(mktemp -d)
          git worktree add "$tmp" gh-pages
          find "$tmp" -mindepth 1 -maxdepth 1 ! -name pr-preview ! -name .git ! -name CNAME -exec rm -rf {} +
          cp -r _site/. "$tmp/"
          touch "$tmp/.nojekyll"
          git -C "$tmp" add -A
          git -C "$tmp" commit --allow-empty -m "Deploy example from $REF (run $GITHUB_RUN_ID)"
          for i in 1 2 3 4 5; do
            git -C "$tmp" push origin gh-pages && break
            [ "$i" = 5 ] && { echo "::error::could not push gh-pages after 5 attempts"; exit 1; }
            git -C "$tmp" pull --rebase origin gh-pages
          done
      - name: Publish the release after the Pages switch
        id: pages
        if: steps.release.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/request-example-pages-build.sh

  report:
    # Example failures occur after image promotion and never hold the release.
    needs: [build, theme, deploy, publish-gh-pages]
    if: failure() && inputs.ref-name != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref-name }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_RESULT: ${{ needs.build.result }}
          THEME_RESULT: ${{ needs.theme.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          GH_PAGES_RESULT: ${{ needs.publish-gh-pages.result }}
          GH_PAGES_ROOT_RESULT: ${{ needs.publish-gh-pages.outputs.root }}
          GH_PAGES_BUILD_RESULT: ${{ needs.publish-gh-pages.outputs.pages }}
        run: |
          set -euo pipefail
          # Keep the existing per-tag title so reruns reuse older build issues.
          title="Example workspace failed to build for $REF"
          if [ "$BUILD_RESULT" = failure ]; then
            body="The post-release example build failed; deployment was not attempted. Any previously published demo is unchanged. Run: $RUN"
          elif [ "$THEME_RESULT" = failure ]; then
            body="The post-release browser checks failed; deployment was not attempted. Run: $RUN"
          elif [ "$DEPLOY_RESULT" = failure ]; then
            body="The post-release example deployment failed after a successful build. The live site's state is unconfirmed; inspect the deployment before retrying. Run: $RUN"
          elif [ "${GH_PAGES_ROOT_RESULT:-}" = failure ]; then
            body="The release deployed to Pages, but writing its build to the gh-pages root failed. PR previews are unaffected. Run: $RUN"
          elif [ "${GH_PAGES_BUILD_RESULT:-}" = failure ]; then
            body="The release build was written to the gh-pages root, but requesting or verifying its Pages build failed. The branch files are available; the live site's state is unconfirmed. Run: $RUN"
          elif [ "${GH_PAGES_RESULT:-}" = failure ]; then
            body="The release's gh-pages publication job failed before its outcome could be confirmed. Inspect the run before retrying. Run: $RUN"
          else
            echo 'No example build or deployment failure to report'
            exit 0
          fi
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all \
            --search "\"$title\" in:title" --limit 100 --json number,title,state \
            | jq -r --arg title "$title" \
              '[.[] | select(.title == $title)] | first // empty | [.number, .state] | @tsv')
          if [ -n "$issue" ]; then
            read -r number state <<< "$issue"
            if [ "$state" = CLOSED ]; then
              gh issue reopen "$number" --repo "$GITHUB_REPOSITORY"
            fi
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
