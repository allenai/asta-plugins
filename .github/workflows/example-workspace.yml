name: Example workspace

# Builds examples/workspace in the published -tex image. Releases call this after
# `latest` moves; this workflow validates only and never publishes the site.
# The check is not required.
on:
  workflow_call:
    inputs:
      ref-name:
        description: Final release tag whose -tex image and assets build the example
        type: string
        required: true
  # Every PR must exercise the same scaffold and uncommitted demo edit.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: example-workspace-${{ github.event.pull_request.number || inputs.ref-name || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    timeout-minutes: 30
    env:
      ASTA_WORKSPACE_RESOLVED_SHA: ${{ github.sha }}
      ASTA_WORKSPACE_RESOLVED_REPOSITORY: ${{ github.repository }}
    container:
      image: ghcr.io/allenai/asta:${{ inputs.ref-name && format('{0}-tex', inputs.ref-name) || 'latest-tex' }}
    defaults:
      run:
        working-directory: examples/workspace
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and validate the example
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          uv tool install --force ../..
          export PATH="$(uv tool dir --bin):$PATH"
          # Start cold: the example must fetch its own managed rules and extensions.
          rm -rf .asta/cache _extensions
          make check
          test -f .asta/cache/workspace.mk
          test -f _extensions/asta-theme/light.scss
          test -f _extensions/evidence/snippet.lua
          test -f _extensions/asta-slides/_extension.yml
          # Verify the resolved source, not just the requested workflow pin.
          python3 -c 'import json, os; from pathlib import Path; state = json.loads(Path(".asta/cache/workspace.json").read_text()); assert state["source_ref"] == os.environ["GITHUB_SHA"], state; assert Path(".asta/cache/workspace.mk").read_bytes().endswith(Path("../../plugins/asta-tools/skills/workspace/assets/workspace.mk").read_bytes())'
          for extension in asta-theme evidence asta-slides; do
            diff -r "../../plugins/asta-tools/skills/workspace/assets/_extensions/$extension" "_extensions/$extension"
          done
          git check-ignore .asta/cache/workspace.mk _extensions/asta-theme/light.scss
          make preview-artifact-check
          git diff --exit-code  # prints any tracked file a build or sync modified
      - name: Render slide customization fixtures
        run: python3 ../../tests/browser/render-slides.py ../../tests/browser/fixtures
      - uses: actions/upload-artifact@v4
        with:
          name: example-workspace-site-${{ matrix.runner }}
          path: examples/workspace/_site
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-slide-fixtures-${{ matrix.runner }}
          path: tests/browser/fixtures
          retention-days: 30
      # After the uploads: this adds what-changed output to the example's _site.
      - name: Check local What changed renders a deck edit
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/asta-chromium"
          uv tool install --force ../..
          # The image ships a released asta; run the one just built from this checkout.
          export PATH="$(uv tool dir --bin):$PATH"
          test "$(command -v asta)" = "$(uv tool dir --bin)/asta"
          # The CLI installs only the browser; this container also lacks Chromium's system libraries.
          uv run --no-project --with playwright==1.64.1 python -m playwright install --with-deps chromium >/dev/null
          uv run --no-project --with playwright==1.64.1 python ../../tests/browser/local-what-changed.py . ../../tests/browser/artifacts
          git diff --exit-code  # prints any tracked file a build or sync modified
      - name: Check local What changed shows every content type of the demo edit
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/asta-chromium"
          export PATH="$(uv tool dir --bin):$PATH"
          # No preview or prebuilt site may mask missing render inputs.
          rm -rf _site
          top=$(git rev-parse --show-toplevel)
          # The demo edit, applied uncommitted as an agent's edit would be. main
          # publishes the same patch's What changed, so it must keep applying.
          if ! git -C "$top" apply examples/workspace-demo.patch; then
            echo "::error file=examples/workspace-demo.patch::The demo edit no longer applies to the example; update examples/workspace-demo.patch with this change"
            exit 1
          fi
          trap 'git -C "$top" checkout -- examples/workspace' EXIT
          uv run --no-project --with playwright==1.64.1 python ../../tests/browser/local-what-changed-demo.py . ../../tests/browser/artifacts
      - name: Check the demo artifact built for main publication
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$(uv tool dir --bin):$PATH"
          # Build separately from the local check, from a clean disposable clone.
          python3 ../../scripts/build-workspace-demo.py "$RUNNER_TEMP/published-demo" 2>&1 | tee "$RUNNER_TEMP/published-demo.log"
          uv run --no-project --with playwright==1.64.1 python ../../tests/browser/local-what-changed-demo.py --site "$RUNNER_TEMP/published-demo" ../../tests/browser/artifacts
          {
            echo '### Main demo What changed timings'
            echo '```text'
            cat "$RUNNER_TEMP/published-demo.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-what-changed-screenshot-${{ matrix.runner }}
          path: |
            tests/browser/artifacts/local-what-changed-deck.png
            tests/browser/artifacts/local-what-changed-no-preview.png
            tests/browser/artifacts/local-what-changed-demo.png
          if-no-files-found: ignore
          retention-days: 30

  theme:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: example-workspace-site-ubuntu-latest
          path: examples/workspace/_site
      - uses: actions/download-artifact@v4
        with:
          name: workspace-slide-fixtures-ubuntu-latest
          path: tests/browser/fixtures
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install browser checks
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check slide geometry and standalone behavior
        working-directory: tests/browser
        run: node workspace-slides.mjs ../../examples/workspace/_site artifacts
      - name: Check rendered deck review
        run: |
          python3 -m venv "$RUNNER_TEMP/deck-review-venv"
          "$RUNNER_TEMP/deck-review-venv/bin/python" -m pip install playwright==1.64.1
          "$RUNNER_TEMP/deck-review-venv/bin/python" -m playwright install --with-deps chromium
          "$RUNNER_TEMP/deck-review-venv/bin/python" tests/browser/deck-review.py examples/workspace/_site tests/browser/artifacts
      - name: Check both themes and evidence readability
        working-directory: tests/browser
        run: npm test -- ../../examples/workspace/_site artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-theme-screenshots
          path: tests/browser/artifacts
          retention-days: 30
