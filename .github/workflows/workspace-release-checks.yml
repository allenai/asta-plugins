name: Workspace release checks
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  pages: read
  packages: read
jobs:
  plugins:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    uses: ./.github/workflows/ci.yml
    with:
      build-runner: ${{ matrix.runner }}
  devcontainer:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/devcontainer-smoke.yml
  checks:
    uses: ./.github/workflows/example-workspace.yml
    with:
      ref-name: ''
  site:
    uses: ./.github/workflows/example-preview.yml
    with:
      release-check: true
