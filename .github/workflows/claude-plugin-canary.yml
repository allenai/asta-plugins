name: Claude plugin compatibility

# Weekly check against the latest Claude Code. A pass on a newer release
# refreshes one pin-bump PR for .github/claude-code-version; a failure keeps
# the pin and opens one issue per failing version and check set.
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  canary:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.cli.outputs.version }}
      setup-failure: >-
        ${{ steps.checkout.outcome == 'failure' && 'checkout'
            || steps.node.outcome == 'failure' && 'Node.js setup'
            || steps.cli.outcome == 'failure' && 'Claude Code install'
            || steps.uv.outcome == 'failure' && 'uv setup'
            || steps.python.outcome == 'failure' && 'Python setup' || '' }}
      selective: ${{ steps.selective.outcome }}
      native: ${{ steps.native.outcome }}
      prompt: ${{ steps.prompt.outcome }}
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: "20"

      - name: Install latest Claude Code CLI
        id: cli
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          version="$("$HOME/.local/bin/claude" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Tested Claude Code $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        id: uv

      - name: Set up Python 3.12
        id: python
        run: uv python install 3.12

      - name: Run selective-install checks
        id: selective
        continue-on-error: true
        env:
          ASTA_TEST_CLAUDE_PLUGIN_DEPS: "1"
        run: uv run --python 3.12 --extra test pytest tests/test_plugin_dependencies.py -q

      - name: Verify native installation of every plugin
        id: native
        continue-on-error: true
        run: uv run --python 3.12 --extra test pytest tests/test_skills.py::TestClaudePluginInstall -q

      - name: Check model-visible skill descriptions
        id: prompt
        continue-on-error: true
        run: bash scripts/verify-plugin-install.sh claude-code

      - name: Fail if any check failed
        if: steps.selective.outcome != 'success' || steps.native.outcome != 'success' || steps.prompt.outcome != 'success'
        run: exit 1

  bump-pin:
    needs: canary
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: claude-code-pin-bump
      queue: max
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false

      - name: Update the pin when the tested release is newer
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.canary.outputs.version }}
        run: |
          current="$(cat .github/claude-code-version)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Expected numeric major.minor.patch versions for the canary and pin.'
            exit 1
          fi
          newest="$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n1)"
          if [ "$VERSION" = "$current" ] || [ "$newest" != "$VERSION" ]; then
            echo "Main already pins $current (tested $VERSION)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # An older rerun must also preserve a newer bump awaiting review.
          pending_sha="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f base=main -f "head=${GITHUB_REPOSITORY_OWNER}:automation/claude-code-pin" \
            --jq 'if length > 1 then error("Multiple open PRs use automation/claude-code-pin.") else .[0].head.sha // empty end')"
          if [ -n "$pending_sha" ]; then
            pending="$(gh api --method GET "repos/$GITHUB_REPOSITORY/contents/.github/claude-code-version" \
              -f "ref=$pending_sha" --jq .content | base64 --decode)"
            if [[ ! "$pending" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo '::error::Expected a numeric major.minor.patch version in the pending pin PR.'
              exit 1
            fi
            newest="$(printf '%s\n%s\n' "$pending" "$VERSION" | sort -V | tail -n1)"
            if [ "$VERSION" = "$pending" ] || [ "$newest" != "$VERSION" ]; then
              echo "An open PR already proposes $pending (tested $VERSION)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          echo "$VERSION" > .github/claude-code-version
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Require GitHub App credentials for automatic PR CI
        if: steps.pin.outputs.changed == 'true'
        env:
          PIN_BUMP_APP_ID: ${{ vars.PIN_BUMP_APP_ID }}
          PIN_BUMP_APP_PRIVATE_KEY: ${{ secrets.PIN_BUMP_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$PIN_BUMP_APP_ID" ] || [ -z "$PIN_BUMP_APP_PRIVATE_KEY" ]; then
            echo '::error::Set the PIN_BUMP_APP_ID repository variable and PIN_BUMP_APP_PRIVATE_KEY secret for a GitHub App with Contents and Pull requests write access to this repository.'
            exit 1
          fi

      - name: Mint GitHub App token
        id: app
        if: steps.pin.outputs.changed == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.PIN_BUMP_APP_ID }}
          private-key: ${{ secrets.PIN_BUMP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the pin-bump PR
        if: steps.pin.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ steps.app.outputs.token }}
          base: main
          branch: automation/claude-code-pin
          add-paths: .github/claude-code-version
          commit-message: "Bump Claude Code test pin to ${{ needs.canary.outputs.version }}"
          title: "Bump Claude Code test pin to ${{ needs.canary.outputs.version }}"
          body: |
            The weekly Claude Code canary passed on ${{ needs.canary.outputs.version }}: selective install, native plugin installation, and model-visible skill descriptions.

            Canary run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  alert:
    needs: canary
    if: always() && github.ref == 'refs/heads/main' && needs.canary.result == 'failure'
    runs-on: ubuntu-latest
    concurrency:
      group: claude-code-canary-alert
      queue: max
    permissions:
      issues: write
    steps:
      - name: Open one issue per failing version and check set
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.canary.outputs.version || 'unknown' }}
          SETUP_FAILURE: ${{ needs.canary.outputs.setup-failure }}
          SELECTIVE: ${{ needs.canary.outputs.selective }}
          NATIVE: ${{ needs.canary.outputs.native }}
          PROMPT: ${{ needs.canary.outputs.prompt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=()
          [ -z "$SETUP_FAILURE" ] || failed+=("$SETUP_FAILURE")
          [ "$SELECTIVE" != failure ] || failed+=("selective install")
          [ "$NATIVE" != failure ] || failed+=("native plugin installation")
          [ "$PROMPT" != failure ] || failed+=("skill descriptions")
          if [ "${#failed[@]}" -gt 0 ]; then
            failures="$(printf '%s, ' "${failed[@]}")"
            failures="${failures%, }"
          else
            failures="unexpected canary failure"
          fi
          title="Claude Code $VERSION canary failed: $failures"
          titles="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq '.[] | select(has("pull_request") | not) | .title')"
          if grep -Fxq -- "$title" <<< "$titles"; then
            echo "Already reported: $title"
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file - <<EOF
          The Claude Code canary failed and kept the current test pin.

          - Version: $VERSION
          - Failure: $failures
          - Run: $RUN_URL
          EOF
