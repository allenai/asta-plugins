name: Claude plugin compatibility

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selective-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install latest Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Run selective-install checks
        env:
          ASTA_TEST_CLAUDE_PLUGIN_DEPS: "1"
        run: uv run --python 3.12 --extra test pytest tests/test_plugin_dependencies.py -q
