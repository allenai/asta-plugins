name: Claude plugin compatibility

# Weekly check against the latest Claude Code. A pass on a newer release
# refreshes one pin-bump PR for .github/claude-code-version; a failure keeps
# the pin and opens one issue per failing version and check set.
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  canary:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.cli.outputs.version }}
      setup-failure: >-
        ${{ steps.checkout.outcome == 'failure' && 'checkout'
            || steps.node.outcome == 'failure' && 'Node.js setup'
            || steps.cli.outcome == 'failure' && 'Claude Code install'
            || steps.uv.outcome == 'failure' && 'uv setup'
            || steps.python.outcome == 'failure' && 'Python setup' || '' }}
      failed-checks: >-
        ${{ format('{0}{1}{2}',
            steps.selective.outcome == 'failure' && 'selective install, ' || '',
            steps.native.outcome == 'failure' && 'native plugin installation, ' || '',
            steps.prompt.outcome == 'failure' && 'skill descriptions, ' || '') }}
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: "20"

      - name: Install latest Claude Code CLI
        id: cli
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          reported="$("$HOME/.local/bin/claude" --version)"
          version="$(bash scripts/parse-cli-version.sh claude-code "$reported")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Tested Claude Code $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        id: uv

      - name: Set up Python 3.12
        id: python
        run: uv python install 3.12

      - name: Run selective-install checks
        id: selective
        continue-on-error: true
        env:
          ASTA_TEST_CLAUDE_PLUGIN_DEPS: "1"
        run: uv run --python 3.12 --extra test pytest tests/test_plugin_dependencies.py -q

      - name: Verify native installation of every plugin
        id: native
        continue-on-error: true
        run: uv run --python 3.12 --extra test pytest tests/test_skills.py::TestClaudePluginInstall -q

      - name: Check model-visible skill descriptions
        id: prompt
        continue-on-error: true
        run: bash scripts/verify-plugin-install.sh claude-code

      - name: Fail if any check failed
        if: steps.selective.outcome != 'success' || steps.native.outcome != 'success' || steps.prompt.outcome != 'success'
        run: exit 1

  maintain-pin:
    needs: canary
    if: always()
    uses: ./.github/workflows/cli-pin-maintenance.yml
    permissions:
      contents: read
      pull-requests: read
      issues: write
    with:
      cli: claude-code
      cli-name: Claude Code
      checks: selective install, native plugin installation, and model-visible skill descriptions
      canary-result: ${{ needs.canary.result }}
      version: ${{ needs.canary.outputs.version }}
      setup-failure: ${{ needs.canary.outputs.setup-failure }}
      failed-checks: ${{ needs.canary.outputs.failed-checks }}
    secrets:
      PIN_BUMP_APP_PRIVATE_KEY: ${{ secrets.PIN_BUMP_APP_PRIVATE_KEY }}
