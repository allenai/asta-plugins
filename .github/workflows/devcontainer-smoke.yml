name: Dev container smoke

on:
  pull_request:
    paths:
      - Dockerfile
      - docker/**
      - image/skills-cli/**
      - src/asta/**
      - plugins/asta-tools/skills/workspace/assets/devcontainer.json
      - plugins/asta-tools/skills/workspace/assets/paper-preview.sh
      - tests/dom/**
      - tests/fixtures/devcontainer-smoke/**
      - .github/workflows/devcontainer-smoke.yml
      - .github/workflows/docker.yml
  workflow_call:
    inputs:
      published-images:
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: asta
            runner: ubuntu-24.04
          - target: tex
            runner: ubuntu-24.04
          - target: asta
            runner: ubuntu-24.04-arm
          - target: tex
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        if: inputs.published-images == true
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - uses: docker/login-action@v3
        if: inputs.published-images == true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        if: inputs.published-images != true
        run: docker build --target ${{ matrix.target }} -t asta-smoke .
      - uses: actions/download-artifact@v4
        if: inputs.published-images == true
        with:
          name: published-${{ matrix.target }}
          path: ${{ runner.temp }}/published-${{ matrix.target }}
      - name: Pull published image by digest
        if: inputs.published-images == true
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/published-$TARGET/published.json"
          tag=$(jq -er .tag "$manifest")
          digest=$(jq -er .digest "$manifest")
          test "$(jq -er .revision "$manifest")" = "$GITHUB_SHA"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -er .digest)" = "$digest"
          image="ghcr.io/allenai/asta@$digest"
          docker pull "$image"
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          docker tag "$image" asta-smoke
      - name: LaTeX Workshop only in the tex image's dev container metadata
        run: |
          set -euo pipefail
          meta=$(docker inspect --format '{{ index .Config.Labels "devcontainer.metadata" }}' asta-smoke)
          echo "$meta" | jq -e 'any(.[]; .postCreateCommand == "asta-persist-auth")'
          if [ "${{ matrix.target }}" = tex ]; then
            echo "$meta" | jq -e 'any(.[]; .customizations.vscode.extensions | index("james-yu.latex-workshop"))'
          else
            ! echo "$meta" | grep -q latex-workshop
          fi
      - name: Check CLI, skills install, Codespaces rebuild and Quarto
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codespace-storage"
          docker run --rm \
            -v "$PWD/tests/fixtures/devcontainer-smoke:/w" \
            -v "$RUNNER_TEMP/codespace-storage:/workspaces" asta-smoke bash -euc '
            asta --help >/dev/null
            python3 /w/check-post-create.py initial
            find ~ -maxdepth 4 -type d -path "*skills/workspace" | grep -q .
            quarto check >/dev/null'
          docker run --rm \
            -v "$PWD/tests/fixtures/devcontainer-smoke:/w" \
            -v "$RUNNER_TEMP/codespace-storage:/workspaces" asta-smoke \
            python3 /w/check-post-create.py rebuild
      - name: Preview answers on port 4848
        run: |
          set -euo pipefail
          for command in asset cli; do
            docker run --rm -v "$PWD/tests/fixtures/devcontainer-smoke:/w" -w /w asta-smoke \
              python3 /w/check-post-attach.py --preview-command "$command"
          done
          for stop_signal in SIGTERM SIGHUP; do
            docker run --rm -v "$PWD/tests/fixtures/devcontainer-smoke:/w" -w /w asta-smoke \
              python3 /w/check-post-attach.py --preview-command cli --stop-signal "$stop_signal"
          done
      - name: Sample paper compiles with SyncTeX
        if: matrix.target == 'tex'
        run: |
          docker run --rm asta-smoke latexmlc --VERSION
          docker run --rm asta-smoke kpsewhich ulem.sty | grep -q ulem.sty
          meta=$(docker inspect --format '{{ index .Config.Labels "devcontainer.metadata" }}' asta-smoke)
          docker run --rm -e ASTA_EDITOR_METADATA="$meta" \
            -v "$PWD/tests/fixtures/devcontainer-smoke:/w" -w /w/paper asta-smoke \
            python3 /w/check-latex-editor.py
          test -s tests/fixtures/devcontainer-smoke/paper/build/main.pdf
          test -s tests/fixtures/devcontainer-smoke/paper/build/main.synctex.gz
      - name: Shared paper preview builds with the image toolchain
        if: matrix.target == 'tex'
        run: |
          preview=$(mktemp -d "$RUNNER_TEMP/paper-preview.XXXXXX")
          mkdir "$preview/paper"
          cp tests/fixtures/devcontainer-smoke/paper/main.tex "$preview/paper/"
          cp tests/fixtures/devcontainer-smoke/paper/refs.bib "$preview/paper/shared refs.bib"
          sed -i 's/{refs.bib}/{shared refs.bib}/' "$preview/paper/main.tex"
          grep -q '{shared refs.bib}' "$preview/paper/main.tex"
          printf '%s\n' '$deps_escape = "unix";' > "$preview/paper/latexmkrc"
          git -C "$preview" init -q
          git -C "$preview" config user.name 'Smoke test'
          git -C "$preview" config user.email 'test@example.invalid'
          git -C "$preview" add paper/main.tex 'paper/shared refs.bib' paper/latexmkrc
          git -C "$preview" commit -qm base
          base=$(git -C "$preview" rev-parse HEAD)
          sed -i 's/Literate Programming/Literate Programming Updated/' "$preview/paper/shared refs.bib"
          git -C "$preview" commit -qam 'edit bibliography'
          docker run --rm \
            -v "$preview:/w" \
            -v "$PWD/plugins/asta-tools/skills/workspace/assets/paper-preview.sh:/paper-preview.sh:ro" \
            -w /w asta-smoke bash -euc '
              git config --global --add safe.directory /w
              bash /paper-preview.sh "$1" paper
            ' _ "$base"
          test -s "$preview/_site/paper-previews/paper/main.pdf"
          grep -q 'Literate Programming Updated' "$preview/_site/paper-previews/paper/main.bbl"
          python3 - "$preview/_site/paper-previews/paper/preview.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1]) as manifest:
              assert json.load(manifest) == {"changed": True, "diff": False, "other_inputs": True}
          PY

      - name: HTML diff marks match the inline palette
        if: matrix.target == 'tex'
        run: |
          preview=$(mktemp -d "$RUNNER_TEMP/paper-diff.XXXXXX")
          mkdir "$preview/paper"
          cp tests/fixtures/devcontainer-smoke/paper-diff/main.tex "$preview/paper/"
          git -C "$preview" init -q
          git -C "$preview" config user.name 'Smoke test'
          git -C "$preview" config user.email 'test@example.invalid'
          git -C "$preview" add paper/main.tex
          git -C "$preview" commit -qm base
          base=$(git -C "$preview" rev-parse HEAD)
          sed -i 's/Dev container/Updated preview/;s/x=1/x=2/' "$preview/paper/main.tex"
          git -C "$preview" commit -qam 'edit paper'
          docker run --rm \
            -v "$preview:/w" \
            -v "$PWD/plugins/asta-tools/skills/workspace/assets/paper-preview.sh:/paper-preview.sh:ro" \
            -w /w asta-smoke bash -euc '
              git config --global --add safe.directory /w
              bash /paper-preview.sh "$1" paper
            ' _ "$base"
          test -s "$preview/_site/paper-previews/paper/what-changed.pdf"
          npm ci --prefix tests/dom
          node tests/dom/check_paper_diff.mjs "$preview/_site/paper-previews/paper/html-diff/index.html"
