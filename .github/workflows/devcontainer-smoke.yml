name: Dev container smoke

on:
  pull_request:
    paths:
      - Dockerfile
      - plugins/asta-tools/skills/workspace/assets/devcontainer.json
      - tests/fixtures/devcontainer-smoke/**
      - .github/workflows/devcontainer-smoke.yml
      - .github/workflows/docker.yml
  workflow_call:
    inputs:
      image-tag-prefix:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: asta
            runner: ubuntu-24.04
          - target: tex
            runner: ubuntu-24.04
          - target: asta
            runner: ubuntu-24.04-arm
          - target: tex
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        if: inputs.image-tag-prefix == ''
        run: docker build --target ${{ matrix.target }} -t asta-smoke .
      - name: Pull published image by digest
        if: inputs.image-tag-prefix != ''
        run: |
          docker buildx version
          suffix=''
          if [ '${{ matrix.target }}' = tex ]; then suffix=-tex; fi
          tag='${{ inputs.image-tag-prefix }}'"$suffix"
          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -er .digest)
          case "$digest" in sha256:*) ;; *) exit 1 ;; esac
          image="ghcr.io/allenai/asta@$digest"
          docker pull "$image"
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          docker tag "$image" asta-smoke
      - name: LaTeX Workshop only in the tex image's dev container metadata
        run: |
          meta=$(docker inspect --format '{{ index .Config.Labels "devcontainer.metadata" }}' asta-smoke)
          if [ "${{ matrix.target }}" = tex ]; then
            echo "$meta" | jq -e 'any(.[]; .customizations.vscode.extensions | index("james-yu.latex-workshop"))'
          else
            ! echo "$meta" | grep -q latex-workshop
          fi
      - name: Check CLI, skills install and Quarto
        run: |
          docker run --rm asta-smoke bash -euc '
            asta --help >/dev/null
            python3 /opt/asta-plugins/tests/fixtures/devcontainer-smoke/check-post-create.py
            find ~ -maxdepth 4 -type d -path "*skills/workspace" | grep -q .
            quarto check >/dev/null'
      - name: Preview answers on port 4848
        run: |
          docker run --rm -v "$PWD/tests/fixtures/devcontainer-smoke:/w" -w /w asta-smoke bash -euc '
            quarto preview --no-browser --port 4848 >/tmp/preview.log 2>&1 &
            for _ in $(seq 60); do curl -sf http://127.0.0.1:4848/ >/dev/null && exit 0; sleep 2; done
            cat /tmp/preview.log; exit 1'
      - name: Sample paper compiles with the CI latexmk command
        if: matrix.target == 'tex'
        run: |
          docker run --rm -v "$PWD/tests/fixtures/devcontainer-smoke:/w" -w /w/paper asta-smoke \
            latexmk -e '$pdf_mode ||= 1;' -interaction=nonstopmode -halt-on-error \
              -file-line-error -outdir=build main.tex
          test -s tests/fixtures/devcontainer-smoke/paper/build/main.pdf
