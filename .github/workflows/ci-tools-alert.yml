name: CI tools update alert

# A failing agent-CLI update stays unmerged; open one issue per failing update
# so the break reaches the repo's watchers instead of sitting in a red PR.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  issues: write

jobs:
  alert:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure'
          && github.event.workflow_run.event == 'pull_request'
          && github.event.workflow_run.actor.login == 'dependabot[bot]'
          && startsWith(github.event.workflow_run.head_branch, 'dependabot/npm_and_yarn/dot-github/ci-tools/') }}
    runs-on: ubuntu-latest
    concurrency:
      group: ci-tools-alert-${{ github.event.workflow_run.head_branch }}
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          title="CI failed on agent CLI update ${BRANCH##*/ci-tools/}"
          body="CI failed at $SHA on Dependabot branch \`$BRANCH\`; the update stays unmerged until it passes. Run: $RUN_URL"
          number="$(gh api --paginate --slurp "repos/$GH_REPO/issues?state=open&per_page=100" \
            | jq -r --arg t "$title" '[.[][] | select(.title == $t and (has("pull_request") | not))][0].number // empty')"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
