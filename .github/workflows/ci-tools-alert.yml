name: CI tools update alert

# Each CLI gets one open issue that collects every failing release, so a lasting
# break stays one thread; an update of that CLI that passes CI closes it.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  issues: write

jobs:
  alert:
    if: >-
      ${{ contains(fromJSON('["failure","timed_out","success"]'), github.event.workflow_run.conclusion)
          && github.event.workflow_run.event == 'pull_request'
          && github.event.workflow_run.actor.login == 'dependabot[bot]'
          && github.event.workflow_run.head_repository.full_name == github.repository
          && startsWith(github.event.workflow_run.head_branch, 'dependabot/npm_and_yarn/ci-tools/') }}
    runs-on: ubuntu-latest
    # Releases of one CLI arrive on different branches, so serialize all runs.
    concurrency:
      group: ci-tools-alert
      queue: max
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          update="${BRANCH##*/ci-tools/}"
          cli="${update%-[0-9]*}"
          title="CLI update stuck: $cli"
          number="$(gh api --paginate --slurp "repos/$GH_REPO/issues?state=open&per_page=100" \
            | jq -r --arg t "$title" '[.[][] | select(.title == $t and (has("pull_request") | not))][0].number // empty')"
          if [[ "$CONCLUSION" == success ]]; then
            if [[ -n "$number" ]]; then
              gh issue close "$number" --comment "CI passed on \`$update\` at \`$SHA\`. Run: $RUN_URL"
            fi
            exit 0
          fi
          body="CI result: \`$CONCLUSION\` at \`$SHA\` on Dependabot branch \`$BRANCH\`. The update stays unmerged until it passes. Run: $RUN_URL"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
