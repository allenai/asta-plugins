<style>
  /* ---- evidence: hover-viewable supporting quotes --------------------------
     A claim marked `.ev` gets a subtle dotted underline; hovering or
     keyboard-focusing it reveals a styled popover (`.ev-pop > .ev-card`) that
     holds the supporting VERBATIM QUOTE and its REFERENCE (with an optional
     citeproc locator). The popover is a real DOM child of the claim and is
     shown purely with CSS (`:hover` / `:focus-within`), so it works
     identically on the full site and on the workspace "what-changed" diff page
     (which strips <script> but keeps this head <style>, class/role/aria/title
     attributes, <a href>, and <details>/<summary>). No JavaScript is required
     for the popover to appear; the optional script only nudges position near
     the viewport edge. */

  /* Subtle affordance: a light dotted underline that says "there is evidence
     here to hover" without pulling the eye away from reading. */
  .ev {
    position: relative;
    border-bottom: 1px dotted currentColor;
    cursor: help;
    text-decoration: none;
  }
  .ev:hover,
  .ev:focus-visible {
    border-bottom-color: var(--bs-link-color, #0d6efd);
    background: color-mix(in srgb, var(--bs-link-color, #0d6efd) 10%, transparent);
    outline: none;
  }

  /* The popover wrapper is transparent and positioned just below the claim. Its
     top padding is a hover "bridge" that overlaps the claim's bottom edge, so
     moving the pointer from the claim into the box never crosses a dead zone —
     and because the wrapper is a DESCENDANT of `.ev`, hovering anywhere in it
     keeps `.ev:hover` true, so the popover stays open with no timers. */
  .ev-pop {
    position: absolute;
    left: 0;
    top: 100%;
    z-index: 1080;
    padding-top: 0.4rem;
    display: block;
    width: max-content;
    max-width: min(360px, 92vw);
    opacity: 0;
    visibility: hidden;
    /* Hiding is DELAYED by a short grace period; showing is immediate. A claim
       that wraps onto several lines has tiny leading gaps BETWEEN its line boxes
       where `:hover` is momentarily false. Without the delay the popover flips
       off and back on as the pointer brushes across those gaps (a visible
       flash). With it, the pointer re-enters the next line well inside the grace
       window, so the hide transition never starts and the popover holds steady.
       Keep the grace modest so moving to a *different* claim doesn't leave two
       popovers overlapping for long. */
    transition: opacity 0.12s ease 0.2s, visibility 0s linear 0.32s;
  }
  .ev:hover > .ev-pop,
  .ev:focus > .ev-pop,
  .ev:focus-within > .ev-pop {
    opacity: 1;
    visibility: visible;
    transition: opacity 0.12s ease 0s, visibility 0s linear 0s;
  }
  /* Near the right viewport edge the optional script adds `.ev-flip`, opening
     the popover leftward instead. Base behaviour (no script) opens rightward. */
  .ev.ev-flip > .ev-pop {
    left: auto;
    right: 0;
  }

  /* The visible card. */
  .ev-card {
    display: block;
    padding: 0.55rem 0.7rem;
    font-size: 0.82rem;
    line-height: 1.5;
    font-style: normal;
    font-weight: 400;
    text-align: left;
    white-space: normal;
    color: var(--bs-body-color, #1a1a1a);
    background: var(--bs-body-bg, #fff);
    border: 1px solid var(--bs-border-color, rgba(0, 0, 0, 0.14));
    border-radius: 6px;
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.16);
  }

  /* The verbatim quote: real typographic quotes + italics and a thin accent
     rule so it reads as exact wording, not a gloss. */
  .ev-pop-text {
    display: block;
  }
  .ev-pop-text.ev-quote {
    padding-left: 0.6rem;
    border-left: 3px solid var(--bs-link-color, #0d6efd);
    color: inherit;
  }

  /* The reference line: the same author–year citation format as the body text,
     rendered by citeproc (locator and all). */
  .ev-pop-src {
    display: block;
    margin-top: 0.45rem;
    padding-top: 0.4rem;
    border-top: 1px solid var(--bs-border-color, rgba(0, 0, 0, 0.08));
    font-size: 0.78rem;
    color: inherit;
  }
  .ev-pop-src a {
    color: var(--bs-link-color, #0d6efd);
  }

  /* Provenance — HOW the quote was obtained — is retained but NOT shown by
     default: it sits behind a small "Source details" disclosure so a reader can
     open it on demand without the popover becoming a wall of metadata. The
     disclosure is built from PLAIN INLINE SPANS (no <details>/<div>) and revealed
     with pure CSS on hover/focus. This matters: the popover lives inside the
     claim's inline <span>, and the what-changed diff wraps inserted claims in
     <ins>; a block element here would force a </ins> mid-nesting that ejects the
     disclosure out of the hidden popover. Inline-only markup keeps the whole
     popover one valid phrasing subtree, so it survives the diff intact. */
  .ev-src {
    display: block;
    margin-top: 0.4rem;
  }
  .ev-src-label {
    display: inline-block;
    cursor: pointer;
    font-size: 0.72rem;
    color: inherit;
    user-select: none;
    outline: none;
  }
  /* A small disclosure triangle we control, so it reads the same in every theme. */
  .ev-src-label::before {
    content: "▸ ";
    color: inherit;
  }
  .ev-src:hover .ev-src-label::before,
  .ev-src:focus-within .ev-src-label::before {
    content: "▾ ";
  }
  .ev-src-label:hover,
  .ev-src-label:focus-visible {
    color: var(--bs-link-color, #0d6efd);
  }
  /* Hidden until the disclosure is hovered or focused. Because the body is a
     descendant of `.ev-src`, hovering it keeps `.ev-src:hover` true, so it stays
     open with no gap. */
  .ev-prov-body {
    display: none;
    margin-top: 0.25rem;
    font-size: 0.72rem;
    line-height: 1.5;
    color: inherit;
  }
  .ev-src:hover .ev-prov-body,
  .ev-src:focus-within .ev-prov-body {
    display: block;
  }
  .ev-prov-body a {
    color: var(--bs-link-color, #0d6efd);
  }
</style>

    const toggleBodyColorMode = (bsSheetEl) => {
      const mode = bsSheetEl.getAttribute("data-mode");
      const bodyEl = window.document.querySelector("body");
      if (mode === "dark") {
        bodyEl.classList.add("quarto-dark");
        bodyEl.classList.remove("quarto-light");
      } else {
        bodyEl.classList.add("quarto-light");
        bodyEl.classList.remove("quarto-dark");
      }
    }
    const toggleBodyColorPrimary = () => {
      const bsSheetEl = window.document.querySelector("link#quarto-bootstrap:not([rel=disabled-stylesheet])");
      if (bsSheetEl) {
        toggleBodyColorMode(bsSheetEl);
      }
    }
    const setColorSchemeToggle = (alternate) => {
      const toggles = window.document.querySelectorAll('.quarto-color-scheme-toggle');
      for (let i=0; i < toggles.length; i++) {
        const toggle = toggles[i];
        if (toggle) {
          if (alternate) {
            toggle.classList.add("alternate");
          } else {
            toggle.classList.remove("alternate");
          }
        }
      }
    };
    const toggleColorMode = (alternate) => {
      // Switch the stylesheets
      const primaryStylesheets = window.document.querySelectorAll('link.quarto-color-scheme:not(.quarto-color-alternate)');
      const alternateStylesheets = window.document.querySelectorAll('link.quarto-color-scheme.quarto-color-alternate');
      manageTransitions('#quarto-margin-sidebar .nav-link', false);
      if (alternate) {
        // note: dark is layered on light, we don't disable primary!
        enableStylesheet(alternateStylesheets);
        for (const sheetNode of alternateStylesheets) {
          if (sheetNode.id === "quarto-bootstrap") {
            toggleBodyColorMode(sheetNode);
          }
        }
      } else {
        disableStylesheet(alternateStylesheets);
        enableStylesheet(primaryStylesheets)
        toggleBodyColorPrimary();
      }
      manageTransitions('#quarto-margin-sidebar .nav-link', true);
      // Switch the toggles
      setColorSchemeToggle(alternate)
      // Hack to workaround the fact that safari doesn't
      // properly recolor the scrollbar when toggling (#1455)
      if (navigator.userAgent.indexOf('Safari') > 0 && navigator.userAgent.indexOf('Chrome') == -1) {
        manageTransitions("body", false);
        window.scrollTo(0, 1);
        setTimeout(() => {
          window.scrollTo(0, 0);
          manageTransitions("body", true);
        }, 40);
      }
    }
    const disableStylesheet = (stylesheets) => {
      for (let i=0; i < stylesheets.length; i++) {
        const stylesheet = stylesheets[i];
        stylesheet.rel = 'disabled-stylesheet';
      }
    }
    const enableStylesheet = (stylesheets) => {
      for (let i=0; i < stylesheets.length; i++) {
        const stylesheet = stylesheets[i];
        if(stylesheet.rel !== 'stylesheet') { // for Chrome, which will still FOUC without this check
          stylesheet.rel = 'stylesheet';
        }
      }
    }
    const manageTransitions = (selector, allowTransitions) => {
      const els = window.document.querySelectorAll(selector);
      for (let i=0; i < els.length; i++) {
        const el = els[i];
        if (allowTransitions) {
          el.classList.remove('notransition');
        } else {
          el.classList.add('notransition');
        }
      }
    }
    const isFileUrl = () => {
      return window.location.protocol === 'file:';
    }
    const hasAlternateSentinel = () => {
      let styleSentinel = getColorSchemeSentinel();
      if (styleSentinel !== null) {
        return styleSentinel === "alternate";
      } else {
        return false;
      }
    }
    const setStyleSentinel = (alternate) => {
      const value = alternate ? "alternate" : "default";
      if (!isFileUrl()) {
        window.localStorage.setItem("quarto-color-scheme", value);
      } else {
        localAlternateSentinel = value;
      }
    }
    const getColorSchemeSentinel = () => {
      if (!isFileUrl()) {
        const storageValue = window.localStorage.getItem("quarto-color-scheme");
        return storageValue != null ? storageValue : localAlternateSentinel;
      } else {
        return localAlternateSentinel;
      }
    }
    const toggleGiscusIfUsed = (isAlternate, darkModeDefault) => {
      const baseTheme = document.querySelector('#giscus-base-theme')?.value ?? 'light';
      const alternateTheme = document.querySelector('#giscus-alt-theme')?.value ?? 'dark';
      let newTheme = '';
      if(authorPrefersDark) {
        newTheme = isAlternate ? baseTheme : alternateTheme;
      } else {
        newTheme = isAlternate ? alternateTheme : baseTheme;
      }
      const changeGiscusTheme = () => {
        // From: https://github.com/giscus/giscus/issues/336
        const sendMessage = (message) => {
          const iframe = document.querySelector('iframe.giscus-frame');
          if (!iframe) return;
          iframe.contentWindow.postMessage({ giscus: message }, 'https://giscus.app');
        }
        sendMessage({
          setConfig: {
            theme: newTheme
          }
        });
      }
      const isGiscussLoaded = window.document.querySelector('iframe.giscus-frame') !== null;
      if (isGiscussLoaded) {
        changeGiscusTheme();
      }
    };
    const authorPrefersDark = true;
    const darkModeDefault = authorPrefersDark;
    let localAlternateSentinel = darkModeDefault ? 'alternate' : 'default';
    // Dark / light mode switch
    window.quartoToggleColorScheme = () => {
      // Read the current dark / light value
      let toAlternate = !hasAlternateSentinel();
      toggleColorMode(toAlternate);
      setStyleSentinel(toAlternate);
      toggleGiscusIfUsed(toAlternate, darkModeDefault);
    };
    // Switch to dark mode if need be
    if (hasAlternateSentinel()) {
      toggleColorMode(true);
    } else {
      toggleColorMode(false);
    }
  </script>

<script>
(() => {
  const host = document.querySelector('[data-paper-preview]');
  const base = host.dataset.paperPreview + '/';
  const slot = host.querySelector('[data-paper-pdf]');
  const modes = host.querySelector('.paper-modes');
  const exists = file => fetch(base + file, { method: 'HEAD' })
    .then(response => response.ok).catch(() => false);
  // The PDF fills the window below what's above it and scrolls inside
  // itself, as Overleaf's PDF pane does, so the page never scrolls to read.
  const fit = () => {
    const frame = slot.querySelector('object');
    if (!frame) return;
    const full = host.classList.contains('paper-full');
    const top = frame.getBoundingClientRect().top + (full ? 0 : scrollY);
    frame.style.height = Math.max(320, innerHeight - top) + 'px';
    // What the site puts below the paper (padding, a footer) comes off too.

  (function () {

      pop.style.opacity = "";

      document.querySelectorAll(".ev").forEach(function (ev) {
        ev.addEventListener("mouseenter", function () { place(ev); });
        ev.addEventListener("focusin", function () { place(ev); });
