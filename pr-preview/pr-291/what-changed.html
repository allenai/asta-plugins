  /* ---- evidence: hover-viewable supporting quotes --------------------------
     A claim marked `.ev` gets a subtle dotted underline; hovering or
     keyboard-focusing it reveals a styled popover (`.ev-pop > .ev-card`) that
     holds the supporting VERBATIM QUOTE and its REFERENCE (with an optional
     citeproc locator). The popover is a real DOM child of the claim and is
     shown purely with CSS (`:hover` / `:focus-within`), so it works
     identically on the full site and on the workspace "what-changed" diff page
     (which strips <script> but keeps this head <style>, class/role/aria/title
     attributes, <a href>, and <details>/<summary>). No JavaScript is required
     for the popover to appear; the optional script only nudges position near
     the viewport edge. */

  /* Subtle affordance: a light dotted underline that says "there is evidence
     here to hover" without pulling the eye away from reading. */
  .ev {
    position: relative;
    border-bottom: 1px dotted currentColor;
    cursor: help;
    text-decoration: none;
  }
  .ev:hover,
  .ev:focus-visible {
    border-bottom-color: var(--bs-link-color, #0d6efd);
    background: color-mix(in srgb, var(--bs-link-color, #0d6efd) 10%, transparent);
    outline: none;
  }

  /* The popover wrapper is transparent and positioned just below the claim. Its
     top padding is a hover "bridge" that overlaps the claim's bottom edge, so
     moving the pointer from the claim into the box never crosses a dead zone —
     and because the wrapper is a DESCENDANT of `.ev`, hovering anywhere in it
     keeps `.ev:hover` true, so the popover stays open with no timers. */
  .ev-pop {
    position: absolute;
    left: 0;
    top: 100%;
    z-index: 1080;
    padding-top: 0.4rem;
    display: block;
    width: max-content;
    max-width: min(360px, 92vw);
    opacity: 0;
    visibility: hidden;
    /* Hiding is DELAYED by a short grace period; showing is immediate. A claim
       that wraps onto several lines has tiny leading gaps BETWEEN its line boxes
       where `:hover` is momentarily false. Without the delay the popover flips
       off and back on as the pointer brushes across those gaps (a visible
       flash). With it, the pointer re-enters the next line well inside the grace
       window, so the hide transition never starts and the popover holds steady.
       Keep the grace modest so moving to a *different* claim doesn't leave two
       popovers overlapping for long. */
    transition: opacity 0.12s ease 0.2s, visibility 0s linear 0.32s;
  }
  .ev:hover > .ev-pop,
  .ev:focus > .ev-pop,
  .ev:focus-within > .ev-pop {
    opacity: 1;
    visibility: visible;
    transition: opacity 0.12s ease 0s, visibility 0s linear 0s;
  }
  /* Near the right viewport edge the optional script adds `.ev-flip`, opening
     the popover leftward instead. Base behaviour (no script) opens rightward. */
  .ev.ev-flip > .ev-pop {
    left: auto;
    right: 0;
  }

  /* The visible card. */
  .ev-card {
    display: block;
    padding: 0.55rem 0.7rem;
    font-size: 0.82rem;
    line-height: 1.5;
    font-style: normal;
    font-weight: 400;
    text-align: left;
    white-space: normal;
    color: var(--bs-body-color, #1a1a1a);
    background: var(--bs-body-bg, #fff);
    border: 1px solid var(--bs-border-color, rgba(0, 0, 0, 0.14));
    border-radius: 6px;
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.16);
  }

  /* The verbatim quote: real typographic quotes + italics and a thin accent
     rule so it reads as exact wording, not a gloss. */
  .ev-pop-text {
    display: block;
  }
  .ev-pop-text.ev-quote {
    padding-left: 0.6rem;
    border-left: 3px solid var(--bs-link-color, #0d6efd);
    color: inherit;
  }

  /* The reference line: the same author–year citation format as the body text,
     rendered by citeproc (locator and all). */

    display: block;
    margin-top: 0.45rem;
    padding-top: 0.4rem;

  /* Provenance — HOW the quote was obtained — is retained but NOT shown by
     default: it sits behind a small "Source details" disclosure so a reader can
     open it on demand without the popover becoming a wall of metadata. The
     disclosure is built from PLAIN INLINE SPANS (no <details>/<div>) and revealed

(() => {
  const root = document.documentElement;
  let stored = null;
  try { stored = window.localStorage.getItem("quarto-color-scheme"); } catch (e) {}
  let dark = root.dataset.wcMode === "dark";
  // A single-theme site has no toggle; a preference saved on another page
  // must not change the diff palette without a corresponding stylesheet.
  const hasAlternate = document.querySelector("link.quarto-color-scheme.quarto-color-alternate:not(.quarto-color-scheme-extra)");

    else if (root.dataset.wcFollowSystem === "true")
      dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  }

  root.dataset.wcMode = mode;
  document.querySelectorAll("link.quarto-color-scheme, link.quarto-color-scheme-extra").forEach((link) => {
    // Quarto keeps primary styles enabled and layers the alternate over them.
    // Extra sheets are render-time helpers and are disabled in either mode.
    const enabled = !link.classList.contains("quarto-color-scheme-extra") &&
      (!link.classList.contains("quarto-color-alternate") || link_mode(link) === mode);

  document.body.classList.add("quarto-" + mode);

    return link.classList.contains("quarto-color-alternate") ? "dark" : "light";
  }
})();

        // whole section. Keep compact neighbors as context, but fold large ones.
        keep[j] = changed[j] || kids[j].textContent.length <= MAX_CONTEXT_CHARS;
      }
    });
    // Out-of-flow/hidden children are never folded and act as run boundaries.
    // (After the context pass so it can't be undone by a neighbor's window.)
    kids.forEach(function (el, k) { if (!flow[k]) keep[k] = true; });
    // Recurse into changed, in-flow containers before moving sibling runs — but
    // never into an <ins>/<del> wrapper. Those wrap a run of inserted/deleted
    // inline content, inside which nothing is "unchanged"; recursing there makes
    // hasChange() see every child as unchanged (no ins/del *descendant*) and fold
    // real inserted text — e.g. collapsing a claim's hover-popover quote behind a
    // bogus "N unchanged blocks" toggle.
    kids.forEach(function (el, k) {
      if (changed[k] && flow[k] && el.children.length &&
          el.tagName !== "INS" && el.tagName !== "DEL") fold(el);
    });
    // Only collapse sibling runs where a block-level disclosure is a valid
    // child. Still recurse through other containers so a changed table cell or
    // list item can fold its own flow-content children.
    if (!FOLD_CONTAINERS[container.tagName]) return;
    var start = 0;
    while (start < kids.length) {
      if (keep[start]) { start++; continue; }
      var end = start;
      while (end < kids.length && !keep[end]) end++;
      var run = kids.slice(start, end);
      var chars = run.reduce(function (a, el) { return a + el.textContent.length; }, 0);
      if (run.length >= MIN_BLOCKS && chars >= MIN_CHARS) collapse(container, run);
      start = end;
    }
  }
  function addToolbar() {
    if (!document.querySelector("details.wc-fold")) return;
    var anchor = document.querySelector("section.page-diff");
    if (!anchor) return;
    var bar = document.createElement("div");
    bar.className = "wc-toolbar";
    var btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "Expand all unchanged";
    btn.addEventListener("click", function () {
      var open = btn.getAttribute("data-open") === "1";
      document.querySelectorAll("details.wc-fold").forEach(function (d) {
        d.open = !open;
      });
      btn.setAttribute("data-open", open ? "0" : "1");
      btn.textContent = open ? "Expand all unchanged" : "Collapse all unchanged";
    });
    bar.appendChild(btn);
    anchor.parentNode.insertBefore(bar, anchor);
  }
  function run() {
    document.querySelectorAll("section.page-diff.changed .diff-body")
      .forEach(fold);
    addToolbar();
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", run);
  } else { run(); }
})();
</script><script>
(function () {
  "use strict";
  document.querySelectorAll(".paper-view").forEach(function (view) {
    var frame = view.querySelector("object");
    var expand = view.querySelector(".paper-expand");
    var buttons = view.querySelectorAll(".paper-modes button");
    buttons.forEach(function (button) {
      button.addEventListener("click", function () {
        var next = frame.cloneNode(true);
        next.setAttribute("data", button.getAttribute("data-pdf") + "#navpanes=0&view=FitH");
        // Where a browser can't show the PDF inline, its link opens the same one.
        var fallback = next.querySelector("a");
        if (fallback) fallback.setAttribute("href", button.getAttribute("data-pdf"));
        frame.replaceWith(next);
        frame = next;
        buttons.forEach(function (other) {
          other.setAttribute("aria-pressed", String(other === button));
        });
      });
    });
    function setFull(full) {
      view.classList.toggle("paper-full", full);
      document.body.style.overflow = full ? "hidden" : "";
      expand.setAttribute("aria-pressed", String(full));
      expand.title = full ? "Back to the report" : "Give the paper the whole window";
    }
    expand.addEventListener("click", function () {
      setFull(!view.classList.contains("paper-full"));
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && view.classList.contains("paper-full")) setFull(false);
    });
  });
})();
</script></body></html>
