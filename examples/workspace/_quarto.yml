project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - lit-review/index.qmd
    - paper/html/index.qmd
    - about.qmd
    - demo/index.qmd
    - appearance.qmd
  resources:
    - paper/html/paper-viewer.js
  preview:
    port: 4848

bibliography: references.bib

# Supporting-evidence store for the `.ev` hover snippets (see
# _extensions/evidence/README.md). Merged into document metadata so a claim can
# back itself with a verbatim quote by key: `[90 tasks]{.ev key="…"}`.
metadata-files:
  - evidence.yml

# Hover-viewable supporting quotes use this checkout's evidence extension
# through the committed _extensions/evidence symlink.
# The filter is a no-op when a document has no `.ev` spans.
filters:
  - _extensions/evidence/snippet.lua

# The workspace skill's own site layout (assets/_quarto.yml), so that the
# example looks like a workspace the skill makes; only the page list is set
# here, so that the project's pages come first and the notes on the example
# last.
website:
  title: "Asta workspace example"
  sidebar:
    tools:
      - icon: github
        href: "https://github.com/allenai/asta-plugins/tree/main/examples/workspace"
        text: "GitHub repo"
        target: _blank
    contents:
      - index.qmd
      - lit-review/index.qmd
      - paper/html/index.qmd
      - section: "This example"
        contents:
          - about.qmd
          - demo/index.qmd
          - appearance.qmd

format:
  html:
    theme:
      dark: [cosmo, _extensions/asta-theme/dark.scss]
      light: [cosmo, _extensions/asta-theme/light.scss]
    # Asta's look: start dark, with a persistent toggle to light.
    # Set your own theme here to replace it.
    respect-user-color-scheme: false
    css:
      - _extensions/asta-theme/asta.css
      - styles.css
    toc: true
    toc-location: left
    include-in-header:
      - _extensions/asta-theme/asta-head.html
      - _extensions/evidence/evidence.head.html
    include-after-body:
      - _extensions/evidence/evidence.body.html
