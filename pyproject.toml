[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asta"
version = "0.125.0"
description = "Asta CLI for scientific literature review"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.1.0",
    "pyhocon>=0.3.60",
    "httpx>=0.26.0",
    "rich>=13.7.0",
    "keyring>=24.3.0",
    "packaging>=23.0",
    "platformdirs>=4.1.0",
    "PyYAML>=6.0",
    "asta-agent[a2a-client]>=1.0.7",
    "asta-artifact>=1.0.10",
]

[project.scripts]
asta = "asta.cli:cli"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "requests>=2.31",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asta"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/workspace/tools"
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::pyparsing.exceptions.PyparsingDeprecationWarning",
]

[tool.hatch.build.targets.wheel.force-include]
"plugins/asta-tools/skills/workspace/assets/what-changed.py" = "asta/workspace_assets/what-changed.py"
"plugins/asta-tools/skills/workspace/assets/deck-review.py" = "asta/workspace_assets/deck-review.py"
"plugins/asta-tools/skills/workspace/assets/paper-discovery.py" = "asta/workspace_assets/paper-discovery.py"
"plugins/asta-tools/skills/workspace/assets/paper-preview.sh" = "asta/workspace_assets/paper-preview.sh"
